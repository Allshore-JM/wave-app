# TEMPORARY (plan section 93b, step 2): measure a full build of two regions on GitHub's runner. No secrets, no upload.
# Results go to ::notice:: annotations (readable without signing in). Removed before the job-only merge.
name: bathy-dryrun
on:
  push:
    branches: ["feat/bathy"]
    paths: [".github/workflows/bathy-dryrun.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        region: [hawaii, gebco]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install numpy==2.5.4 scipy==1.18.1 pillow==13.0.0 rasterio==1.5.2 certifi==2026.10.23
      - name: Measure
        shell: bash
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -o pipefail
          echo "::notice title=$REGION start::nproc $(nproc), $(df -h . | tail -1)"
          EXTRA=()
          if [ "$REGION" = "gebco" ]; then
            t0=$(date +%s)
            python -I - <<'PY' || { echo "::error title=gebco download::failed"; exit 1; }
          import certifi, shutil, ssl, urllib.request
          ctx = ssl.create_default_context(cafile=certifi.where())
          url = "https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/ice_surface_elevation/geotiff/gebco_2026_geotiff.zip"
          with urllib.request.urlopen(url, context=ctx, timeout=60) as r, open("gebco_2026_geotiff.zip", "wb") as f:
              shutil.copyfileobj(r, f, 8 << 20)
          PY
            echo "::notice title=gebco download::$(stat -c %s gebco_2026_geotiff.zip) bytes in $(( $(date +%s) - t0 )) s"
            EXTRA=(--gebco gebco_2026_geotiff.zip)
          fi
          rc=0
          /usr/bin/time -v -o time.txt python tools/bathy/build_bathy.py build --region "$REGION" --version 1 --out build/bathy "${EXTRA[@]}" > build.log 2>&1 || rc=$?
          tail -25 build.log
          echo "::notice title=$REGION build::rc $rc; $(grep -E 'Elapsed|Maximum resident' time.txt | tr -s ' ' | tr '\n' ';')"
          tail -6 build.log | cut -c1-240 | while IFS= read -r line; do
            echo "::notice title=$REGION log::$line"
          done
          echo "::notice title=$REGION size::$(du -sb build/bathy | cut -f1) bytes on disk; files $(find build/bathy -type f | wc -l); $(df -h . | tail -1)"
          exit "$rc"
