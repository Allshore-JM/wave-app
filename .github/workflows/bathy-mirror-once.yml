# TEMPORARY (plan section 111a, owner 2026-11-26: "Yes, mirror now"): copies the 10 NSW Marine LiDAR archives from
# their ELVIS links (gone on 2026-11-30 00:00 UTC) into the frames bucket under static/bathy-src/nsw-marine-2018/, once,
# hash-checked, never overwriting (tools/bathy/bathy_mirror.py). Runs only on a push to feat/bathy-intl that touches this
# file. REMOVE BEFORE THE MERGE (a test pins that it is gone).
name: bathy-mirror-once
on:
  push:
    branches: ["feat/bathy-intl"]
    paths: [".github/workflows/bathy-mirror-once.yml"]
permissions:
  contents: read
concurrency:
  group: bathy-mirror-once
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install numpy==2.5.4 boto3==1.43.98 certifi==2026.10.23
      - run: python tools/bathy/bathy_mirror.py tools/bathy/mirror_nsw.json --check
      - name: Mirror
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -o pipefail
          python tools/bathy/bathy_mirror.py tools/bathy/mirror_nsw.json | tee mirror.log
          tail -15 mirror.log >> "$GITHUB_STEP_SUMMARY"
