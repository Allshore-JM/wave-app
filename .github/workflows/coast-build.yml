# Coastline data for the overlay's land clip (tools/coast). On push: unit tests only. On manual
# dispatch: tests, then download GSHHG 2.3.7 (the GMT project's release asset, pinned by sha256),
# build both tiers, run --check, and (only when `upload` is true) publish to the frames bucket
# under static/coast/v1/ with immutable caching, index.json written last. Input `set`: "coast" (the land set,
# static/coast/v1), "lakes" (the Great Lakes water set for the lake overlay, static/coast/lakes-v1; plan section 50),
# "lakeoutlines" (every lake >= 100 km2, drawn under the wind overlay, static/coast/lakeoutlines-v1; plan section 51) or
# "places" (Natural Earth borders and places + GeoNames towns, static/places/v2, tools/places/build_places.py; plan
# section 51: the Natural Earth files are pinned by commit and sha256, GeoNames' cities1000.zip changes daily and its
# sha256 and date are recorded in the index; v2 = v1 + the name pass of V7-3, v1 stays immutable) or "coast-v2" /
# "coast-v3" (the land set with the bathymetry shoreline, static/coast/<v2|v3>, tools/coast/build_coast_v2.py --set:
# v2 = Hawaii, plan section 103; v3 = Hawaii + Puerto Rico/USVI, Guam/CNMI and American Samoa, plan section 104; v1
# built from the pinned GSHHG, the pinned bathymetry tiles fetched, the set built and checked; its upload refuses
# unpinned output).
# Secrets for the upload: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET.
name: coast-build
on:
  push:
    branches: ["**"]                       # branches only: a rollback tag on an old commit is not a new test run
    paths: ["tools/coast/**", "tests/coast/**", "tools/places/**", "tests/places/**", "tests/conftest.py", "static_overlay/**", "tests/overlay/**", "static_ui/**", "tests/ui/**", "templates/index.html", ".github/workflows/coast-build.yml"]
  workflow_dispatch:
    inputs:
      set:
        description: "coast (land, static/coast/v1), lakes (Great Lakes water, static/coast/lakes-v1), lakeoutlines (every lake, static/coast/lakeoutlines-v1), places (borders and names, static/places/v2), coast-v2 (land with the Hawaii bathymetry shoreline, static/coast/v2) or coast-v3 (+ Puerto Rico/USVI, Guam/CNMI, American Samoa, static/coast/v3)"
        default: "coast"
      upload:
        description: "publish to R2 under the set's prefix (true/false)"
        default: "false"
      replace:
        description: "overwrite a DIFFERENT build under the same prefix (true/false; objects are immutable for a year)"
        default: "false"
concurrency:
  group: coast-build
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install numpy==2.2.6 shapely==2.2.0 pillow==13.0.0 pytest==9.1.1 certifi==2026.10.23
      - run: python -m pytest -q tests/coast tests/places
  client-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38   # v6.5.0
        with:
          node-version: "24"
          check-latest: true                 # Node 24.22.1+ (security release 2026-10-21; plan section 57)
      - run: node --test --test-timeout=20000 tests/overlay/coast.test.js tests/overlay/playback.test.js tests/overlay/overlay.test.js tests/overlay/bootstrap.test.js tests/overlay/flow.test.js tests/overlay/panel.test.js tests/overlay/sst.test.js tests/overlay/sst_timers.test.js tests/overlay/sat.test.js tests/overlay/isobars.test.js tests/overlay/lake.test.js tests/overlay/lakeoutlines.test.js tests/overlay/radar.test.js tests/overlay/bathy.test.js tests/overlay/bathy_v2.test.js tests/ui/forecast.test.js tests/ui/window.test.js tests/ui/mapclamp.test.js tests/ui/early.test.js tests/ui/firstview.test.js tests/ui/graticule.test.js tests/ui/tools.test.js tests/ui/tools-ui.test.js tests/ui/points.test.js tests/ui/mypoints.test.js tests/ui/forecast-view.test.js tests/ui/livelist.test.js tests/ui/livelist-page.test.js tests/ui/buoyperiod.test.js tests/ui/tides.test.js tests/ui/tides-page.test.js tests/ui/winds.test.js tests/ui/winds-page.test.js tests/ui/basemap.test.js tests/ui/places.test.js tests/ui/buoylinks.test.js tests/ui/nearest.test.js tests/ui/alerts.test.js
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60                    # coast-v3: ~33k more tiles + ~10 min trace (plan section 104)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install numpy==2.2.6 shapely==2.2.0 pillow==13.0.0 boto3==1.43.98 certifi==2026.10.23
      - name: Download GSHHG 2.3.7
        if: github.event.inputs.set != 'places'
        run: |
          CA="$(python -c 'import certifi; print(certifi.where())')"   # certifi's list, not the runner's (plan section 57)
          NOCAPATH="$(mktemp -d)"     # an empty CA folder: --cacert alone leaves Ubuntu curl's /etc/ssl/certs in use
          curl -sSfL --cacert "$CA" --capath "$NOCAPATH" -o gshhg-bin-2.3.7.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-bin-2.3.7.zip
          echo "28600e8f7a08645aab43079326df6504212ec5ccb2b4bcf3b5f4f12ed60e82bc  gshhg-bin-2.3.7.zip" | sha256sum -c -
      - name: Download Natural Earth (pinned) and GeoNames cities1000
        if: github.event.inputs.set == 'places'
        shell: bash
        run: |
          set -eo pipefail
          CA="$(python -c 'import certifi; print(certifi.where())')"   # certifi's list, not the runner's (plan section 57)
          NOCAPATH="$(mktemp -d)"     # an empty CA folder: --cacert alone leaves Ubuntu curl's /etc/ssl/certs in use
          mkdir -p src/ne
          NE=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson
          for f in ne_10m_admin_0_boundary_lines_land ne_10m_admin_1_states_provinces_lines ne_10m_populated_places; do
            curl -sSfL --cacert "$CA" --capath "$NOCAPATH" -o "src/ne/$f.geojson" "$NE/$f.geojson"
          done
          ( cd src/ne && sha256sum -c - <<'EOF'
          74d9c16229c095fde65943a9919e337682f044bcebccb120764f38edf3b70f4a  ne_10m_admin_0_boundary_lines_land.geojson
          1a1f30ccaaf4cc9c4bde34266f0b8cbb955d3a4cf254b756912255f2ec7c75b6  ne_10m_admin_1_states_provinces_lines.geojson
          9b8e3de09048ef00dfc70357dbb9fa324493f214b5e0ae4daf1aa79a8d10116b  ne_10m_populated_places.geojson
          EOF
          )
          curl -sSfL --cacert "$CA" --capath "$NOCAPATH" -o src/cities1000.zip https://download.geonames.org/export/dump/cities1000.zip
          sha256sum src/cities1000.zip
      - name: Build and check
        shell: bash
        env:
          SET: ${{ github.event.inputs.set }}
        run: |
          case "$SET" in coast|lakes|lakeoutlines|places) ;; coast-v2|coast-v3) ;; *) echo "set must be coast, lakes, lakeoutlines, places, coast-v2 or coast-v3"; exit 2;; esac
          rc=0
          if [ "$SET" = "places" ]; then
            CMD=(python tools/places/build_places.py --ne src/ne --geonames src/cities1000.zip --out build/places/v2)
          elif [ "$SET" = "coast" ]; then
            CMD=(python tools/coast/build_coast.py --zip gshhg-bin-2.3.7.zip --out build/coast/v1)
          elif [ "$SET" = "coast-v2" ] || [ "$SET" = "coast-v3" ]; then
            V="${SET#coast-}"
            python tools/coast/build_coast.py --zip gshhg-bin-2.3.7.zip --out build/coast/v1 | tail -4 | tee build-v1.log
            CMD=(python tools/coast/build_coast_v2.py --set "$V" --v1 build/coast/v1 --tiles build/bathy-tiles --fetch --out "build/coast/$V")
          else
            CMD=(python tools/coast/build_coast.py --set "$SET" --zip gshhg-bin-2.3.7.zip --out "build/coast/$SET-v1")
          fi
          /usr/bin/time -v -o time.txt "${CMD[@]}" | tee build.log || rc=$?
          { echo '```'; cat build.log; grep -E "Maximum resident|Elapsed" time.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Keep the coast-v2/v3 build (the bytes an upload publishes, for the local checks; plan sections 103-104)
        if: ${{ success() && (github.event.inputs.set == 'coast-v2' || github.event.inputs.set == 'coast-v3') }}   # only a build that passed --check (G70 P3-2)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6.0.0
        with:
          name: ${{ github.event.inputs.set }}-build
          path: build/coast/${{ github.event.inputs.set == 'coast-v3' && 'v3' || 'v2' }}
          retention-days: 14
          if-no-files-found: error
      - name: Upload to R2
        if: github.event.inputs.upload == 'true'
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPLACE: ${{ github.event.inputs.replace }}
          SET: ${{ github.event.inputs.set }}
        run: |
          rc=0
          case "$SET" in
            coast) CMD=(python tools/coast/build_coast.py --out build/coast/v1 --upload static/coast/v1);;
            coast-v2) CMD=(python tools/coast/build_coast_v2.py --out build/coast/v2 --upload static/coast/v2);;
            coast-v3) CMD=(python tools/coast/build_coast_v2.py --set v3 --out build/coast/v3 --upload static/coast/v3);;
            lakes|lakeoutlines) CMD=(python tools/coast/build_coast.py --out "build/coast/$SET-v1" --upload "static/coast/$SET-v1");;
            places) CMD=(python tools/places/build_places.py --out build/places/v2 --upload static/places/v2);;
            *) echo "set must be coast, lakes, lakeoutlines, places, coast-v2 or coast-v3"; exit 2;;
          esac
          [ "$REPLACE" = "true" ] && CMD+=(--replace)
          "${CMD[@]}" | tee upload.log || rc=$?
          tail -3 upload.log >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
