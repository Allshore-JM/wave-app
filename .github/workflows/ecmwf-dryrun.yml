# TEMPORARY (plan section 43, step 1): proves the ECMWF job on GitHub's runner with the pinned environment (eccodes 2.48 and
# CCSDS) before any merge. Runs on pushes to the feature branch only, uploads nothing, needs no secrets.
# REMOVE before the job-only merge, together with tools/model_frames/ecmwf_dryrun_check.py.
name: ecmwf-dryrun
on:
  push:
    branches: ["feat/ecmwf-overlays"]
    paths: ["tools/model_frames/**", ".github/workflows/ecmwf-dryrun.yml"]
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
          cache-environment: true
      - name: Record environment
        shell: bash -l {0}
        run: |
          echo "env: $(micromamba list | awk '$1 ~ /^(python|eccodes|python-eccodes|numpy|pillow|boto3)$/ {printf "%s=%s ", $1, $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the newest run in memory and check every frame against eccodes
        shell: bash -l {0}
        run: |
          set -o pipefail
          /usr/bin/time -v -o time.txt python tools/model_frames/ecmwf_dryrun_check.py | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The job's own entry point, dry run of three steps
        shell: bash -l {0}
        run: |
          set -o pipefail
          python tools/model_frames/ecmwf.py --dry-run --steps 0,150,360 | tee -a "$GITHUB_STEP_SUMMARY"
