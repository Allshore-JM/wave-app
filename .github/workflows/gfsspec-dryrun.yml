# TEMPORARY (plan section 77, step 2): a dry run of the GFS spectral job on the runner, pushed from the feature branch.
# Builds run 2026110112 (an AWS archive that stays ~10 days), publishes nothing, needs no secrets; the summary records
# the cpus, the time, the memory and per-station digests to compare with a local build. REMOVED BEFORE THE MERGE.
name: gfsspec-dryrun
on:
  push:
    branches: [feat/gfs-spectral]
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            certifi=2026.10.23
            ca-certificates=2026.10.23
          cache-environment: true
      - name: Dry run
        shell: bash -l {0}
        run: |
          set -eo pipefail
          echo "nproc: $(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -v -o time.txt python tools/model_frames/gfs_spectral.py --dry-run --run 2026110112 --out out | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib, json, sys
          sys.path.insert(0, "tools/model_frames")
          import gfs_spectral as G
          doc = json.load(open("out/index.json"))
          body = open("out/spectral.bin", "rb").read()
          print("::notice::spectral.bin sha256", hashlib.sha256(body).hexdigest(), "count", doc["count"],
                "left_out", len(doc["left_out"]), "build_s", doc["build_s"], "nproc", doc["nproc"], "workers", doc["workers"])
          for sid in sorted(doc["stations"])[::max(1, len(doc["stations"]) // 20)][:20]:
              s = doc["stations"][sid]
              rec = body[s * G.RECORD_BYTES:(s + 1) * G.RECORD_BYTES]
              print("::notice::", sid, hashlib.sha256(rec).hexdigest()[:16])
          EOF
