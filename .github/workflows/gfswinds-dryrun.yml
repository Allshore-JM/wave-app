# TEMPORARY (plan section 53 step 2): a dry run of the GFS winds job on the runner (time, memory, bytes), on pushes to
# the feature branch only. No secrets, no uploads. REMOVE before the job-only merge (a test pins its absence then).
name: gfswinds-dryrun
on:
  push:
    branches: ["feat/gfs-bulletins"]
    paths: ["tools/model_frames/gfs_winds.py", ".github/workflows/gfswinds-dryrun.yml"]
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
          cache-environment: true
      - name: Dry run
        shell: bash -l {0}
        run: |
          set -o pipefail
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/gfs_winds.py --dry-run --out out > log.txt 2>&1 || rc=$?
          cat log.txt
          while read -r line; do echo "::notice::$line"; done < <(grep -E "building|members|GFS winds|dry run|failed" log.txt)
          echo "::notice::rc=$rc $(grep -E 'Maximum resident' time.txt | xargs) $(grep -E 'Elapsed' time.txt | xargs)"
          python -c "import json,hashlib;d=json.load(open('out/index.json'));b=open('out/winds.bin','rb').read();print('::notice::run',d['run'],'count',d['count'],'left_out',len(d['left_out']),'sha',d['sha256'][:16],'ok',hashlib.sha256(b).hexdigest()==d['sha256'])"
          exit "$rc"
