# TEMPORARY (plan section 50, step 1): a full dry run of the Great Lakes job on GitHub's runner (eccodes 2.48, and
# NOMADS from GitHub's addresses). No secrets, no uploads. Removed before the job-only merge (a test pins its absence).
name: glwu-dryrun
on:
  push:
    branches: ["feat/great-lakes"]
    paths: [".github/workflows/glwu-dryrun.yml"]
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
          cache-environment: true
      - name: Full dry run
        shell: bash -l {0}
        run: |
          set -o pipefail
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/glwu.py --dry-run 2>&1 | tee out.txt || rc=$?
          echo "::notice::rc=$rc $(grep -E 'publishing run|"run"' out.txt | tr '\n' ' ')"
          echo "::notice::$(grep -c 'done in' out.txt) steps; $(grep -c 'bulletin left out' out.txt) bulletins left out; $(grep -E 'Elapsed|Maximum resident' time.txt | tr '\n' ' ')"
          echo "::notice::$(grep -E 'f000 done|f149 done' out.txt | tr '\n' ' ')"
          exit "$rc"
