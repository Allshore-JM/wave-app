# TEMPORARY (plan section 96, step 2): measure a full build of each lidar region on GitHub's runner. No secrets, no upload.
# Results go to ::notice:: annotations (readable without signing in). Removed before the job-only merge.
name: lidar-dryrun
on:
  push:
    branches: ["feat/lidar"]
    paths: [".github/workflows/lidar-dryrun.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        region: [hawaii-lidar, guam-lidar, pr-lidar, nwhi-lidar]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install numpy==2.5.4 scipy==1.18.1 pillow==13.0.0 rasterio==1.5.2 certifi==2026.10.23
      - name: Measure
        shell: bash
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -o pipefail
          echo "::notice title=$REGION start::nproc $(nproc), $(df -h . | tail -1)"
          rc=0
          /usr/bin/time -v -o time.txt python tools/bathy/build_bathy.py build --region "$REGION" --version 1 --out build/bathy > build.log 2>&1 || rc=$?
          tail -25 build.log
          echo "::notice title=$REGION build::rc $rc; $(grep -E 'Elapsed|Maximum resident' time.txt | tr -s ' ' | tr '\n' ';')"
          tail -6 build.log | cut -c1-240 | while IFS= read -r line; do
            echo "::notice title=$REGION log::$line"
          done
          crc=0
          python tools/bathy/build_bathy.py check "build/bathy/$REGION/v1" > check.log 2>&1 || crc=$?
          echo "::notice title=$REGION check::rc $crc; $(tail -1 check.log | cut -c1-240)"
          echo "::notice title=$REGION size::$(du -sb build/bathy | cut -f1) bytes on disk; files $(find build/bathy -type f | wc -l); $(df -h . | tail -1)"
          [ "$rc" = 0 ] && exit "$crc"
          exit "$rc"
