# TEMPORARY (fix/ci-robust only; removed before the merge): proves on GitHub's runner that the publishers' micromamba
# set-up step works with the fixed download address, eight times side by side. No secrets, no uploads.
name: mm-dryrun
on:
  push:
    branches: ["fix/ci-robust"]
    paths: [".github/workflows/mm-dryrun.yml"]
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            certifi=2026.10.23
            ca-certificates=2026.10.23
          cache-environment: true
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64
      - name: Report
        shell: bash -l {0}
        run: |
          set -eo pipefail
          v="$(micromamba --version)"
          py="$(python -c 'import eccodes, numpy, PIL, boto3, certifi, sys; print(sys.version.split()[0], "eccodes", eccodes.codes_get_api_version(), "numpy", numpy.__version__, "certifi", certifi.__version__)')"
          sha="$(sha256sum "$MAMBA_EXE" | cut -c1-16)"
          echo "::notice::job ${{ matrix.n }}: micromamba $v (sha256 $sha) | python $py"
