# Publishes the last ~30 h of satellite altimeter wave heights (Copernicus Marine WAVE_GLO_PHY_SWH_L3_NRT_014_001,
# anonymous on the open CloudFerro bucket; NOAA Jason-3 OGDR from its public directory, ALT_JASON3_INDEX overrides the
# URL, "off" leaves it out) collocated with the GFS-Wave
# frames, to R2 under alt/v1/ as one chunk per 3-hour window (plan sections 45 and 81). Files are regenerated upstream
# every 30 min while data arrives: the job runs every 10 min from the trigger Worker (this cron is the fallback), a quiet
# run ends in seconds, a changed window takes 20-40 s.
# Credit: "Generated using E.U. Copernicus Marine Service Information", doi 10.48670/moi-00179 (in every chunk).
# Secrets: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET.
name: model-alt
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "YYYYMMDDTHH (blank = every window in reach whose inputs changed)"
        default: ""
      dry_run:
        description: "no uploads (true/false)"
        default: "false"
      force:
        description: "rebuild every window in reach (true/false)"
        default: "false"
concurrency:
  group: model-alt
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        id: env
        continue-on-error: true   # a failed download skips this tick (the Set-up check step below), it does not fail the run
        with:
          environment-name: alt
          create-args: >-
            python=3.11.16
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            certifi=2026.10.23
            ca-certificates=2026.10.23
            h5py=3.14.0
          cache-environment: true
          # a fixed address for the micromamba binary: without it the action asks GitHub for the newest release and
          # checks it with one request that is never retried (8 failed runs, 2026-10-29 .. 11-05). To move to a newer
          # micromamba, change the version in every publisher at once (tests/model_frames/test_ci_robust.py).
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64
      - name: Set-up check
        if: steps.env.outcome != 'success'
        shell: bash
        run: |
          # The set-up itself failed (2026-11-08: GitHub's own release server answered 504 for three hours; 85 runs
          # failed in the same step and sent 85 mails while nothing was wrong with the data). The next tick retries by
          # itself, so a skipped tick costs nothing: the run stays green and says so. It fails loud only at the first
          # tick of 00 and 12 UTC, so a set-up broken for good still mails twice a day (tests/model_frames/test_ci_robust.py).
          echo "set-up failed: this tick is skipped (the next tick retries)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::micromamba set-up failed (the download from GitHub); this tick is skipped"
          hm=$(date -u +%H%M)
          case "$hm" in
            000[0-9]|120[0-9]) echo "::error::micromamba set-up failed at a reporting tick ($hm UTC)"; exit 1 ;;
          esac
      - name: Record environment
        if: steps.env.outcome == 'success'
        shell: bash -l {0}
        run: |
          echo "env: $(micromamba list | awk '$1 ~ /^(python|numpy|pillow|boto3|h5py|hdf5|certifi|ca-certificates)$/ {printf "%s=%s ", $1, $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish satellite wave heights
        if: steps.env.outcome == 'success'
        shell: bash -l {0}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ALT_JASON3_INDEX: ${{ vars.ALT_JASON3_INDEX }}
          WINDOW: ${{ github.event.inputs.window }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$WINDOW" ] && ! [[ "$WINDOW" =~ ^[0-9]{8}T[0-9]{2}$ ]]; then echo "bad window input"; exit 2; fi
          ARGS=()
          [ -n "$WINDOW" ] && ARGS+=(--window "$WINDOW")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/alt.py "${ARGS[@]}" || rc=$?
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
