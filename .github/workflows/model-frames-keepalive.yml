# Public-repo schedules are disabled after 60 days without repository activity. Re-enabling the
# publishers (overlay frames and forecast points) twice a month keeps them alive during a quiet stretch
# (any ordinary commit also resets the timer). The real monitor is latest.json age: the site shows a
# stale banner past 9 h.
name: model-frames-keepalive
on:
  schedule:
    - cron: "23 3 1,15 * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable model-frames-keepalive.yml --repo "$GITHUB_REPOSITORY"   # itself first: a failure below cannot stop it
          gh workflow enable model-frames.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable model-points.yml --repo "$GITHUB_REPOSITORY"
