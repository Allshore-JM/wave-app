# Public-repo schedules are disabled after 60 days without repository activity. Re-enabling the
# publisher monthly keeps it alive during a quiet stretch (any ordinary commit also resets the
# timer). The real monitor is latest.json age: the site shows a stale banner past 9 h.
name: model-frames-keepalive
on:
  schedule:
    - cron: "23 3 1,15 * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable model-frames.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable model-frames-keepalive.yml --repo "$GITHUB_REPOSITORY"
