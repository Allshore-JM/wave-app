# Phase 0 spike for the forecast overlays: decode + encode one GFS-Wave / GFS step on Linux.
# Manual only. No secrets, no publishing, no site code. Output = step summary + artifact.
name: model-frames-spike
on:
  push:
    branches: [feat/overlays-0]        # spike branch only; never the site branches
    paths: [".github/workflows/model-frames-spike.yml", "tools/model_frames/**"]
  workflow_dispatch:
    inputs:
      step:
        description: "forecast hour to sample"
        default: "24"
permissions:
  contents: write            # the spike commits its small text report back to THIS branch only
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: frames
          create-args: >-
            python=3.11
            eccodes
            python-eccodes
            numpy
            pillow
          cache-environment: true
      - name: Toolchain check
        shell: bash -l {0}
        run: |
          python -c "import eccodes; print('eccodes', eccodes.codes_get_api_version())"
          /usr/bin/time -v python -c "import numpy, PIL; print('ok')" 2>&1 | grep -E "Maximum resident" || true
      - name: Spike
        shell: bash -l {0}
        run: |
          /usr/bin/time -v python tools/model_frames/spike.py --step "${{ github.event.inputs.step || 24 }}" --out spike_out 2> time.txt | tee spike_out/report.md
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY" | tee -a spike_out/report.md
      - name: Commit report (text only) to the spike branch
        if: github.ref == 'refs/heads/feat/overlays-0'
        run: |
          mkdir -p tools/model_frames/spike_results
          cp spike_out/report.md spike_out/report.json tools/model_frames/spike_results/
          git config user.name "spike-bot" && git config user.email "spike-bot@users.noreply.github.com"
          git add tools/model_frames/spike_results
          git commit -m "spike results $(date -u +%FT%TZ) [skip ci]" || echo "no change"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: spike-output
          path: spike_out/
          retention-days: 7
