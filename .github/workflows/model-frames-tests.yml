# Offline unit tests for the overlay frame job (no network, no secrets).
name: model-frames-tests
on:
  push:
    paths: ["tools/model_frames/**", "tests/model_frames/**", ".github/workflows/model-frames-tests.yml"]
  pull_request:
    paths: ["tools/model_frames/**", "tests/model_frames/**"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pillow pytest
      - run: python -m pytest -q tests/model_frames
