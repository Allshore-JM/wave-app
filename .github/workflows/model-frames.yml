# Renders + publishes the newest COMPLETE NOAA GFS-Wave/GFS run as overlay frames to R2.
# Schedules fire only on the repository's default branch. The job short-circuits in ~20 s when
# the live run is already current, so it runs every 10 minutes: NOAA completes a cycle between
# +4:36 and +4:52 h (8 cycles measured) and GitHub drops or delays scheduled ticks (four of the
# first six were dropped after the merge), so a sparse schedule publishes hours late.
# Secrets: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET.
name: model-frames
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "comma list of forecast hours (blank = all 81). A subset is never published live."
        default: ""
      dry_run:
        description: "no uploads (true/false)"
        default: "false"
      force:
        description: "re-publish even if the run is current (true/false)"
        default: "false"
concurrency:
  group: model-frames
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462   # v2
        with:
          environment-name: frames
          create-args: >-
            python=3.11
            eccodes
            python-eccodes
            numpy
            pillow
            boto3
          cache-environment: true
      - name: Publish frames
        shell: bash -l {0}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          STEPS: ${{ github.event.inputs.steps }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$STEPS" ] && ! [[ "$STEPS" =~ ^[0-9,]+$ ]]; then echo "bad steps input"; exit 2; fi
          ARGS=()
          [ -n "$STEPS" ] && ARGS+=(--steps "$STEPS" --dry-run)      # a subset is only ever a dry run
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/run.py "${ARGS[@]}" || rc=$?
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -eq 3 ]; then echo "no complete run yet" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          exit "$rc"

