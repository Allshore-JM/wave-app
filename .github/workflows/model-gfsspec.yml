# Publishes the "GFS Spectral" tables' product to R2 under gfswave/spectral/v1/ (plan section 77): our own swell split of
# every listed station's GFS-Wave spectra, from NOAA's spectra archive on AWS (the file the winds job streams, ~1.7 GB,
# streamed once more per run, split in a process pool). Between cycles the job short-circuits in a few seconds; a build
# takes minutes (the step summary records the cpus, the workers and the time). The same pinned environment (one cached env).
# A second step publishes the Nearshore Analysis of the pilot stretch under gfswave/nearshore/v1/ (plan section 109) from
# the 51201 spectrum the first step keeps and the data branch (data/nearshore) at the commit pinned below. It never fails
# the tables' job: a failure is a warning in the summary, and the next tick tries again.
# Secrets: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET.
name: model-gfsspec
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "YYYYMMDDHH (blank = the newest complete run, if not live yet)"
        default: ""
      dry_run:
        description: "no uploads (true/false)"
        default: "false"
      nearshore_only:
        description: "skip the spectral split, run only the nearshore analysis (true/false)"
        default: "false"
concurrency:
  group: model-gfsspec
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40                    # the build's own budget stops at 25 min
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        id: env
        continue-on-error: true   # a failed download skips this tick (the Set-up check step below), it does not fail the run
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            certifi=2026.10.23
            ca-certificates=2026.10.23
          cache-environment: true
          # a fixed address for the micromamba binary: without it the action asks GitHub for the newest release and
          # checks it with one request that is never retried (8 failed runs, 2026-10-29 .. 11-05). To move to a newer
          # micromamba, change the version in every publisher at once (tests/model_frames/test_ci_robust.py).
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64
      - name: Set-up check
        if: steps.env.outcome != 'success'
        shell: bash
        run: |
          # The set-up itself failed (2026-11-08: GitHub's own release server answered 504 for three hours; 85 runs
          # failed in the same step and sent 85 mails while nothing was wrong with the data). The next tick retries by
          # itself, so a skipped tick costs nothing: the run stays green and says so. It fails loud only at the first
          # tick of 00 and 12 UTC, so a set-up broken for good still mails twice a day (tests/model_frames/test_ci_robust.py).
          echo "set-up failed: this tick is skipped (the next tick retries)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::micromamba set-up failed (the download from GitHub); this tick is skipped"
          hm=$(date -u +%H%M)
          case "$hm" in
            000[0-9]|120[0-9]) echo "::error::micromamba set-up failed at a reporting tick ($hm UTC)"; exit 1 ;;
          esac
      - name: Record environment
        if: steps.env.outcome == 'success'
        shell: bash -l {0}
        run: |
          echo "env: $(micromamba list | awk '$1 ~ /^(python|boto3|certifi|ca-certificates)$/ {printf "%s=%s ", $1, $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the GFS spectral split
        if: steps.env.outcome == 'success'
        shell: bash -l {0}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN: ${{ github.event.inputs.run }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          NEARSHORE_ONLY: ${{ github.event.inputs.nearshore_only }}
        run: |
          if [ "$NEARSHORE_ONLY" = "true" ]; then echo "spectral split skipped (nearshore only)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ -n "$RUN" ] && ! [[ "$RUN" =~ ^[0-9]{10}$ ]]; then echo "bad run input"; exit 2; fi
          ARGS=()
          [ -n "$RUN" ] && ARGS+=(--run "$RUN")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          echo "nproc: $(nproc)" | tee -a "$GITHUB_STEP_SUMMARY"
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/gfs_spectral.py "${ARGS[@]}" || rc=$?
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -eq 3 ]; then echo "no complete run yet" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          exit "$rc"
      - name: Nearshore data
        if: steps.env.outcome == 'success'
        id: nsdata
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: 8d16aecc26c1a5ea966376d32c4718f1cf6bd81d   # data/nearshore: the pilot table, the atlas, the tide predictions
          path: nearshore-data
      - name: Publish the nearshore analysis
        if: steps.env.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20                # a build of all regions takes a few minutes; the archive fallback gives up after six
        shell: bash -l {0}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          NSDATA: ${{ steps.nsdata.outcome }}
        run: |
          if [ "$NSDATA" != "success" ]; then echo "::warning::the nearshore data could not be checked out; this tick is skipped"; exit 0; fi
          ARGS=(--data nearshore-data/ns --from-archive)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          rc=0
          python tools/model_frames/nearshore.py "${ARGS[@]}" || rc=$?
          if [ "$rc" -eq 3 ]; then echo "nearshore: nothing to do yet" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::the nearshore analysis failed (exit $rc); the tables are not affected"
            echo "nearshore: FAILED (exit $rc)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
