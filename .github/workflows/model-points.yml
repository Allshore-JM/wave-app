# Builds + publishes the forecast-point product (every sea cell's wave partitions and wind for the newest
# COMPLETE NOAA GFS-Wave run, as block tiles) to R2 under gfswave/points/v1 -- see tools/model_frames/points.py.
# A separate workflow with its own concurrency group, so it never delays the overlay frames (model-frames.yml);
# both are dispatched every 10 minutes by the Cloudflare Worker (tools/model_frames/trigger) and by GitHub's own
# schedule as the fallback. The job short-circuits in ~20 s when the live run is already current.
# Secrets: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET (the frames job's).
# The environment is the frames job's, pinned to the same versions (one cached environment for both).
name: model-points
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "comma list of forecast hours (blank = all 209: hourly to 120, 3-hourly to 384). A subset is only ever a dry run."
        default: ""
      dry_run:
        description: "build everything, upload nothing"
        type: boolean
        default: false
      force:
        description: "rebuild even if the run is current (it can move the pointer back to an older run)"
        type: boolean
        default: false
concurrency:
  group: model-points
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120                   # a 209-step build takes ~15-25 min; a killed build leaves no failure record
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        id: env
        continue-on-error: true   # a failed download skips this tick (the Set-up check step below), it does not fail the run
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            certifi=2026.10.23
            ca-certificates=2026.10.23
          cache-environment: true
          # a fixed address for the micromamba binary: without it the action asks GitHub for the newest release and
          # checks it with one request that is never retried (8 failed runs, 2026-10-29 .. 11-05). To move to a newer
          # micromamba, change the version in every publisher at once (tests/model_frames/test_ci_robust.py).
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64
      - name: Set-up check
        if: steps.env.outcome != 'success'
        shell: bash
        run: |
          # The set-up itself failed (2026-11-08: GitHub's own release server answered 504 for three hours; 85 runs
          # failed in the same step and sent 85 mails while nothing was wrong with the data). The next tick retries by
          # itself, so a skipped tick costs nothing: the run stays green and says so. It fails loud only at the first
          # tick of 00 and 12 UTC, so a set-up broken for good still mails twice a day (tests/model_frames/test_ci_robust.py).
          echo "set-up failed: this tick is skipped (the next tick retries)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::micromamba set-up failed (the download from GitHub); this tick is skipped"
          hm=$(date -u +%H%M)
          case "$hm" in
            000[0-9]|120[0-9]) echo "::error::micromamba set-up failed at a reporting tick ($hm UTC)"; exit 1 ;;
          esac
      - name: Record environment
        if: steps.env.outcome == 'success'
        shell: bash -l {0}
        run: |
          echo "env: $(micromamba list | awk '$1 ~ /^(python|eccodes|python-eccodes|numpy|pillow|boto3|certifi|ca-certificates)$/ {printf "%s=%s ", $1, $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runner: $(nproc) cpus, $(free -g | awk '/^Mem:/ {print $2}') GB memory, $(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ') free in RUNNER_TEMP" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish points
        if: steps.env.outcome == 'success'
        shell: bash -l {0}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          STEPS: ${{ github.event.inputs.steps }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$STEPS" ] && ! [[ "$STEPS" =~ ^[0-9,]+$ ]]; then echo "bad steps input"; exit 2; fi
          ARGS=()
          [ -n "$STEPS" ] && ARGS+=(--steps "$STEPS" --dry-run)      # a subset is only ever a dry run
          [ -z "$STEPS" ] && [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/points.py "${ARGS[@]}" || rc=$?
          grep -E "Maximum resident|Elapsed" time.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -eq 3 ]; then echo "no complete run yet" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          exit "$rc"
