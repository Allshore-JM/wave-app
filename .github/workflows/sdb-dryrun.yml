# TEMPORARY (plan section 97, step 2): measure a full build of the Pacific satellite depths on GitHub's runner. No secrets,
# no upload. Results go to ::notice:: annotations (readable without signing in). Removed before the job-only merge.
name: sdb-dryrun
on:
  push:
    branches: ["feat/sdb"]
    paths: [".github/workflows/sdb-dryrun.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install numpy==2.5.4 scipy==1.18.1 pillow==13.0.0 rasterio==1.5.2 pyproj==3.8.0 certifi==2026.10.23
      - name: Measure
        shell: bash
        env:
          REGION: pacific-sdb
        run: |
          set -o pipefail
          echo "::notice title=$REGION start::nproc $(nproc), $(df -h . | tail -1)"
          rc=0
          /usr/bin/time -v -o time.txt python tools/bathy/build_bathy.py build --region "$REGION" --version 1 --out build/bathy > build.log 2>&1 || rc=$?
          tail -25 build.log
          echo "::notice title=$REGION build::rc $rc; $(grep -E 'Elapsed|Maximum resident' time.txt | tr -s ' ' | tr '\n' ';')"
          grep -E 'blocks hold a usable pixel|tiles|written|levels' build.log | tail -8 | cut -c1-240 | while IFS= read -r line; do
            echo "::notice title=$REGION log::$line"
          done
          tail -4 build.log | cut -c1-240 | while IFS= read -r line; do
            echo "::notice title=$REGION tail::$line"
          done
          crc=0
          python tools/bathy/build_bathy.py check "build/bathy/$REGION/v1" > check.log 2>&1 || crc=$?
          echo "::notice title=$REGION check::rc $crc; $(tail -1 check.log | cut -c1-240)"
          echo "::notice title=$REGION size::$(du -sb build/bathy | cut -f1) bytes on disk; files $(find build/bathy -type f | wc -l); $(df -h . | tail -1)"
          for z in 8 9 10 11 12 13 14; do
            echo "::notice title=$REGION z$z::$(find build/bathy/$REGION/v1/t/$z -type f 2>/dev/null | wc -l) tiles"
          done
          [ "$rc" = 0 ] && exit "$crc"
          exit "$rc"
