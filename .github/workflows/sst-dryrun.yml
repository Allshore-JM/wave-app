# TEMPORARY (plan section 44 step 1; removed before the job-only merge): a dry run of the SST tiles job on the runner
# for every push to feat/sst-overlay (no secrets, no uploads). Results go to annotations (readable without a sign-in).
name: sst-dryrun
on:
  push:
    branches: ["feat/sst-overlay"]
    paths: ["tools/model_frames/sst*.py", ".github/workflows/sst-dryrun.yml"]
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: sst
          create-args: >-
            python=3.11.16
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            h5py=3.14.0
          cache-environment: true
      - name: Dry run
        shell: bash -l {0}
        run: |
          set -o pipefail
          echo "::notice::env $(micromamba list | awk '$1 ~ /^(python|numpy|pillow|h5py|hdf5)$/ {printf "%s=%s ", $1, $2}')"
          rc=0
          /usr/bin/time -v -o time.txt python tools/model_frames/sst.py --dry-run --local out > log.txt 2>&1 || rc=$?
          tail -n 8 log.txt | while IFS= read -r l; do echo "::notice::$l"; done
          echo "::notice::rc=$rc $(grep -E 'Maximum resident|Elapsed' time.txt | tr '\n' ' ')"
          echo "::notice::objects $(find out -type f | wc -l), $(du -sm out | cut -f1) MB"
          exit "$rc"
