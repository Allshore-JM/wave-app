name: tides-fes
# FES2022b tide predictions at the forecast points with no tide station near (plan section 112, step 4).
# FES2022b is licensed to the owner's AVISO+ account: its files and the constants extracted from them never leave this
# job. The constants are kept between runs in the Actions cache ENCRYPTED with AVISO_PASS (the repository is public and
# a pull request from a fork may read caches, never secrets); only predictions are published, to R2 tides/fes/v1/.
# Secrets: AVISO_USER, AVISO_PASS (the owner's AVISO+ login with FES2022b access), R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET (the model bucket, as the other publishers).
on:
  schedule:
    - cron: "17 3 * * 1,4"                 # Monday + Thursday 03:17 UTC: each run publishes 47 days from two days back;
                                           # twice a week also keeps the constants' cache in use (GitHub drops a cache
                                           # not used for 7 days, and making it again is the ~3 h download)
  workflow_dispatch:
    inputs:
      fes_url:
        description: "the FES2022b ocean-tide (extrapolated) folder on AVISO+'s THREDDS file server (https)"
        default: "https://tds-odatis.aviso.altimetry.fr/thredds/fileServer/dataset-auxiliary-fes-tide-model/fes2022b/ocean_tide_extrapolated"
      upload:
        description: "publish to R2 (true/false)"
        default: "true"
concurrency:
  group: tides-fes
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  predict:
    runs-on: ubuntu-24.04
    timeout-minutes: 330                   # the first run (no cache) downloads 34 files of ~160 MB from AVISO+:
                                           # ~5 min a file on 2026-11-27 (run 45940535650), ~3 h in all
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt h5py==3.14.0 boto3==1.43.98 certifi==2026.10.23 pytest==9.1.1   # the site's own (tests import app: G76 P1-1)
      - run: python -m pytest -q tests/test_tides_model.py tests/test_tide_harmonic.py
      - name: Restore the encrypted constants
        id: cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809   # v4.2.4
        with:
          path: consts.json.enc
          key: fes-consts-v1-${{ hashFiles('station_coords.json', 'tide_stations.json', 'tide_global.json', 'tide_national.json', 'tide_constituents.json', 'tools/tides/fes_points.py') }}
      - name: Decrypt the constants
        id: decrypt
        if: steps.cache.outputs.cache-hit == 'true'
        env:
          AVISO_PASS: ${{ secrets.AVISO_PASS }}
        shell: bash
        run: |
          # a cache made under an older AVISO_PASS cannot be read: the constants are made again (G76 P2-7)
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:AVISO_PASS -in consts.json.enc -out tools/tides/.fes_consts.json 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            rm -f tools/tides/.fes_consts.json consts.json.enc
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download FES2022b one file at a time (only when the constants must be made)
        if: steps.cache.outputs.cache-hit != 'true' || steps.decrypt.outputs.ok != 'true'
        env:
          AVISO_USER: ${{ secrets.AVISO_USER }}
          AVISO_PASS: ${{ secrets.AVISO_PASS }}
          FES_URL: ${{ github.event.inputs.fes_url || 'https://tds-odatis.aviso.altimetry.fr/thredds/fileServer/dataset-auxiliary-fes-tide-model/fes2022b/ocean_tide_extrapolated' }}
        shell: bash
        run: |
          set -eo pipefail
          test -n "$AVISO_USER" -a -n "$AVISO_PASS" || { echo "AVISO_USER / AVISO_PASS secrets are not set"; exit 2; }
          case "$FES_URL" in https://*) ;; *) echo "fes_url must be https"; exit 2;; esac
          CA="$(python -c 'import certifi; print(certifi.where())')"   # certifi's list, not the runner's (plan section 57)
          NOCAPATH="$(mktemp -d)"     # an empty CA folder: --cacert alone leaves Ubuntu curl's /etc/ssl/certs in use
          mkdir -p fes
          # HTTPS (AVISO+'s THREDDS file server, Basic auth inside TLS): the AVISO+ login never travels in clear. Their FTP
          # offers no TLS (2026-11-27: "500 AUTH not understood"), so it is not used.
          # AVISO+ can close a transfer early (run 45944053840: "curl: (18) transfer closed with 4266025 bytes remaining",
          # file 14 of 34): curl retries every error and resumes the file (-C -), a check proves it is whole, and a file
          # still bad is fetched afresh, three attempts in all
          fetch() {   # fetch URL OUT CHECK...
            local url="$1" out="$2"; shift 2
            for attempt in 1 2 3; do
              if curl -sSf --retry 5 --retry-all-errors --retry-delay 30 -C - --proto '=https' --cacert "$CA" --capath "$NOCAPATH" --user "$AVISO_USER:$AVISO_PASS" -o "$out" "$url" && "$@"; then
                return 0
              fi
              echo "$(basename "$out"): attempt $attempt failed"
              rm -f "$out"
              if [ "$attempt" = 3 ]; then return 1; fi
              sleep 60
            done
          }
          # the extrapolated grids have values over land too: AVISO+'s mask (1 MB, beside the grids' folder) says which
          # cells are native ocean (run 45958228397 read them without it and kept ~no point)
          MASK_URL="${FES_URL%/*}/mask_fes2022B.nc"
          fetch "$MASK_URL" fes/mask_fes2022B.nc python -c "import h5py, sys; h5py.File(sys.argv[1], 'r')['mask'].shape" fes/mask_fes2022B.nc
          # one global grid on disk at a time: download, add to the partial constants, delete (G76 P2-9)
          for c in 2n2 eps2 j1 k1 k2 l2 lambda2 m2 m3 m4 m6 m8 mf mks2 mm mn4 ms4 msf msqm mtm mu2 n2 n4 nu2 o1 p1 q1 r2 s1 s2 s4 sa ssa t2; do
            f="${c}_fes2022.nc"
            fetch "$FES_URL/$f.xz" "fes/$f.xz" xz -t "fes/$f.xz"
            xz -d "fes/$f.xz"
            python tools/tides/fes_points.py --mask fes/mask_fes2022B.nc --add-file "fes/$f"
            rm -f "fes/$f" "fes/$f.xz"
          done
      - name: Predict (and publish)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          UPLOAD: ${{ github.event.inputs.upload || 'true' }}
        shell: bash
        run: |
          set -eo pipefail
          ARGS=(--out build/tides-fes --consts tools/tides/.fes_consts.json)
          [ "$UPLOAD" = "true" ] && ARGS+=(--upload)
          python tools/tides/fes_points.py "${ARGS[@]}"
          rm -rf fes                          # the model's files never leave this job
          if [ -f consts.json.enc ]; then rm -f tools/tides/.fes_consts.json; fi   # a cache hit: the plain copy goes
      - name: Encrypt the constants for the cache
        if: steps.cache.outputs.cache-hit != 'true' || steps.decrypt.outputs.ok != 'true'
        env:
          AVISO_PASS: ${{ secrets.AVISO_PASS }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:AVISO_PASS -in tools/tides/.fes_consts.json -out consts.json.enc
          rm -f tools/tides/.fes_consts.json
