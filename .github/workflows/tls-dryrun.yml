# TEMPORARY (plan section 57, step 1): runs tools/tls_check.py in the three environments the trust list
# matters in, on the feature branch only, with no secrets. Removed before the merge (a test pins its absence).
name: tls-dryrun
on:
  push:
    branches: ["fix/tls-certifi"]
permissions:
  contents: read
jobs:
  publishers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39   # v3.2.1
        with:
          environment-name: frames
          create-args: >-
            python=3.11.16
            eccodes=2.48.0
            python-eccodes=2.48.0
            numpy=2.4.6
            pillow=12.3.0
            boto3=1.43.98
            certifi=2026.10.23
            ca-certificates=2026.10.23
          cache-environment: true
      - name: Check
        shell: bash -l {0}
        run: |
          echo "::notice::$(micromamba list | awk '$1 ~ /^(certifi|ca-certificates|openssl|botocore)$/ {printf "%s=%s ", $1, $2}')"
          rc=0; python tools/tls_check.py --real > tls.txt || rc=$?; cat tls.txt >> "$GITHUB_STEP_SUMMARY"; grep -E "^python=|^trust path|FAIL|^tls_check:" tls.txt | sed "s/^/::notice::/"; exit $rc
  pip-jobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install numpy==2.2.6 boto3==1.43.98 certifi==2026.10.23
      - run: |
          rc=0; python tools/tls_check.py --real --paths certifi,botocore > tls.txt || rc=$?; cat tls.txt >> "$GITHUB_STEP_SUMMARY"; grep -E "^python=|^trust path|FAIL|^tls_check:" tls.txt | sed "s/^/::notice::/"; exit $rc
      - name: curl with certifi's file (coast-build's downloads)
        run: |
          CA="$(python -c 'import certifi; print(certifi.where())')"
          rc=0
          for h in dv-g3b-emudhra.we-have-a-problem.com dv-g3b-aaa-emudhra.we-have-a-problem.com; do
            e=0; curl -sS -o /dev/null --max-time 20 --cacert "$CA" "https://$h/" || e=$?
            if [ "$e" = 60 ]; then echo "::notice::PASS curl+certifi $h refused (exit 60)"; else echo "::notice::FAIL curl+certifi $h exit $e (60 = refused)"; rc=1; fi
            e=0; curl -sS -o /dev/null --max-time 20 "https://$h/" || e=$?
            echo "::notice::the runner's own list: $h curl exit $e (0 = trusted, 60 = refused)"
          done
          for u in https://github.com/ https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/README.md https://download.geonames.org/export/dump/; do
            if curl -sS -o /dev/null --max-time 30 --cacert "$CA" "$u"; then echo "::notice::PASS curl+certifi $u"; else echo "::notice::FAIL curl+certifi $u"; rc=1; fi
          done
          exit $rc
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.11.9"
      - run: pip install -r requirements.txt
      - run: |
          rc=0; python tools/tls_check.py --real --paths certifi > tls.txt || rc=$?; cat tls.txt >> "$GITHUB_STEP_SUMMARY"; grep -E "^python=|^trust path|FAIL|^tls_check:" tls.txt | sed "s/^/::notice::/"; exit $rc
      - run: echo "::notice::$(python -c 'import app, json; print(json.dumps(app._tls_health()))' | tail -1)"
        env:
          LIVE_BACKGROUND: "0"
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38   # v6.5.0
        with:
          node-version: "24"
          check-latest: true
      - run: echo "::notice::node $(node --version)"
