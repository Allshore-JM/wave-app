<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wave Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    html, body { height: 100%; }
    #map { height: 420px; border: 1px solid #ccc; }
    .leaflet-tooltip { font-weight: 600; }
    .sticky-top-bar { position: sticky; top: 0; z-index: 1000; background:#fff; border-bottom: 1px solid #eee; }
    .form-inline .form-select, .form-inline .form-control { width: auto; }
    canvas.chart-tall { height: 260px !important; }
  </style>
</head>
<body class="bg-light">

  <div class="container-fluid py-3">
    <div class="sticky-top-bar pb-2">
      <form id="controlForm" class="row g-2 align-items-center" method="GET" action="/">
        <div class="col-auto">
          <label for="station" class="form-label mb-0">Station</label>
          <select class="form-select" id="station" name="station">
            {% for sid, name in stations %}
              <option value="{{ sid }}" {% if sid == selected_station %}selected{% endif %}>{{ sid }} — {{ name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="tz" class="form-label mb-0">Time Zone</label>
          <select class="form-select" id="tz" name="tz">
            <option value="">(Buoy Local)</option>
            {% for tz in timezones %}
              <option value="{{ tz }}" {% if tz == selected_tz %}selected{% endif %}>{{ tz }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="unit" class="form-label mb-0">Units</label>
          <select class="form-select" id="unit" name="unit">
            {% for u in units %}
              <option value="{{ u }}" {% if u == selected_unit %}selected{% endif %}>{{ u }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="view" class="form-label mb-0">View</label>
          <select class="form-select" id="view" name="view">
            <option value="Table" {% if selected_view == 'Table' %}selected{% endif %}>Table</option>
            <option value="Graph" {% if selected_view == 'Graph' %}selected{% endif %}>Graph</option>
          </select>
        </div>

        <div class="col-auto">
          <button type="submit" class="btn btn-primary" id="updateBtn">Update</button>
        </div>
      </form>
    </div>

    <div class="row mt-2">
      <div class="col-12">
        <div id="map"></div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        {% if error %}
          <div class="alert alert-warning">{{ error }}</div>
        {% endif %}

        {% if selected_view == 'Graph' %}
          <!-- Graph View -->
          <div id="graphs" class="card">
            <div class="card-body">
              <!-- Graph header: Cycle, Location, Time Zone -->
              <div class="mb-2">
                <div class="fw-bold">{{ graph_data.cycle }}</div>
                <div class="fw-bold">{{ graph_data.location }}</div>
                <div class="fw-bold">Time Zone: {{ graph_data.timezone }}</div>
              </div>

              <div class="mb-4">
                <canvas id="heightChart" class="chart-tall"></canvas>
              </div>
              <div class="mb-4">
                <canvas id="periodChart" class="chart-tall"></canvas>
              </div>
              <div>
                <canvas id="directionChart" class="chart-tall"></canvas>
              </div>
            </div>
          </div>
        {% else %}
          <!-- Table View -->
          <div id="tableWrap" class="card">
            <div class="card-body">
              {{ table_html|safe }}
            </div>
          </div>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    // ---------------- Map (satellite, one-world, no grey sides) ----------------
    const mapKey = 'mapView';
    function saveMapView(map) {
      const v = {c: map.getCenter(), z: map.getZoom()};
      sessionStorage.setItem(mapKey, JSON.stringify({lat: v.c.lat, lng: v.c.lng, z: v.z}));
    }
    function loadMapView() {
      try { return JSON.parse(sessionStorage.getItem(mapKey)); } catch(e) { return null; }
    }

    // One-world bounds (avoid wrap & side gaps)
    const worldBounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));
    const map = L.map('map', {
      worldCopyJump: false,
      zoomControl: true,
      maxBounds: worldBounds,
      maxBoundsViscosity: 1.0
    });

    const saved = loadMapView();
    if (saved) {
      map.setView([saved.lat, saved.lng], saved.z);
    } else {
      map.fitBounds(worldBounds);
      map.setView([20, -160], 2);
    }

    // Esri World Imagery (satellite)
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 8,
      minZoom: 2,
      noWrap: true,
      attribution: 'Tiles © Esri & contributors'
    }).addTo(map);

    // Plot stations
    fetch('/stations.json')
      .then(r => r.json())
      .then(stations => {
        stations.forEach(s => {
          const mk = L.circleMarker([s.lat, s.lon], {
            radius: 2,
            color: '#FFD600',
            fillColor: '#FFD600',
            fillOpacity: 1,
            weight: 1
          }).addTo(map);
          mk.bindTooltip(s.id, {permanent: false, direction: 'top', offset: [0, -2]});
          mk.on('click', () => {
            document.getElementById('station').value = s.id;
            saveMapView(map);
            document.getElementById('controlForm').submit();
          });
        });
      });

    document.getElementById('controlForm').addEventListener('submit', () => saveMapView(map));

    // ---------------- Graphs ----------------
    {% if selected_view == 'Graph' and graph_data %}
    const GD = {{ graph_data|tojson|safe }};

    const colors = {
      s1: '#C00000',
      s2: '#ED7D31',
      s3: '#FFC000',
      s4: '#00B050',
      s5: '#00B0F0',
      s6: '#92D050',
      combined: '#7030A0'
    };

    // --- Label parse & format helpers (robust to multiple string shapes) ---
    const monthIdx = (mName) => {
      if (!mName) return NaN;
      const k = mName.slice(0,3).toLowerCase();
      const map = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
      return map[k];
    };

    function parseLabelToDate(str) {
      if (!str) return new Date(NaN);
      let s = String(str).trim();
      // Drop leading day name like "Saturday, "
      s = s.replace(/^[A-Za-z]+,\s+/, '');

      // First try native parser
      let d = new Date(s);
      if (!isNaN(d)) return d;

      // "Month DD, YYYY h:mm AM"
      let m = s.match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (m) {
        const mo = monthIdx(m[1]);
        const day = +m[2], yr = +m[3];
        let hr = +m[4], mn = +m[5], ap = m[6].toUpperCase();
        hr = (hr % 12) + (ap === 'PM' ? 12 : 0);
        return new Date(yr, mo, day, hr, mn);
      }

      // "M/D/YY h:mm AM"
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (m) {
        const mo = +m[1]-1, day = +m[2];
        let yr = +m[3]; if (yr < 100) yr += 2000;
        let hr = +m[4], mn = +m[5], ap = m[6].toUpperCase();
        hr = (hr % 12) + (ap === 'PM' ? 12 : 0);
        return new Date(yr, mo, day, hr, mn);
      }

      return new Date(NaN);
    }

    function formatMDYHM(d) {
      if (!(d instanceof Date) || isNaN(d)) return '';
      const mm = d.getMonth() + 1;
      const dd = d.getDate();
      const yy = (d.getFullYear() % 100).toString().padStart(2,'0');
      let h = d.getHours();
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
      const m = d.getMinutes().toString().padStart(2,'0');
      return `${mm}/${dd}/${yy} ${h}:${m}${ap}`;
    }

    // grid helpers (12-hr majors)
    function isMajorHour(label, scale, value) {
      try {
        const real = scale.getLabelForValue(value);
        const d = parseLabelToDate(real);
        const hr = d.getHours();
        return hr === 0 || hr === 12;
      } catch { return false; }
    }

    // finite helpers
    const finiteVals = arr => arr.filter(v => v !== null && v !== undefined && Number.isFinite(v));
    const maxAcross = arrays => {
      let m = -Infinity; arrays.forEach(a => finiteVals(a).forEach(v => { if (v > m) m = v; }));
      return m;
    };
    const minAcross = arrays => {
      let m = Infinity; arrays.forEach(a => finiteVals(a).forEach(v => { if (v < m) m = v; }));
      return m;
    };
    const padMax = (v, pct = 0.10) => Number.isFinite(v) ? v * (1 + pct) : v;
    const niceCeil = (v, step) => Math.ceil(v / step) * step;

    // label density
    function labelEvery(n) { if (n<=16) return 1; if (n<=32) return 2; if (n<=64) return 4; if (n<=96) return 6; if (n<=160) return 10; return Math.ceil(n/16); }
    const showEvery = labelEvery(GD.labels.length);

    // y-steps
    function heightStep(mx){ if(mx<=1)return .1; if(mx<=2)return .2; if(mx<=4)return .5; if(mx<=8)return 1; return 2;}
    function periodStep(mx){ if(mx<=8)return 1; if(mx<=16)return 2; return 5;}

    // ranges
    const hArrs = [GD.height.s1,GD.height.s2,GD.height.s3,GD.height.s4,GD.height.s5,GD.height.s6,GD.height.combined];
    let hMax = maxAcross(hArrs); if (!Number.isFinite(hMax)) hMax = 1; hMax = niceCeil(padMax(hMax,0.10), heightStep(hMax));
    const pArrs = [GD.period.s1,GD.period.s2,GD.period.s3,GD.period.s4,GD.period.s5,GD.period.s6];
    let pMax = maxAcross(pArrs); if (!Number.isFinite(pMax)) pMax = 10; pMax = niceCeil(padMax(pMax,0.10), periodStep(pMax));
    const dArrs = [GD.direction.s1,GD.direction.s2,GD.direction.s3,GD.direction.s4,GD.direction.s5,GD.direction.s6];
    let dMin = minAcross(dArrs), dMax = maxAcross(dArrs);
    if (!Number.isFinite(dMin) || !Number.isFinite(dMax) || dMin===dMax) { dMin = 0; dMax = 360; }

    const commonOpts = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false, axis: 'x' },
      layout: { padding: { top: 8, right: 8, bottom: 0, left: 8 } },
      elements: {
        point: { radius: 2, hoverRadius: 4 },
        line: { borderWidth: 0, tension: 0, fill: false } // dots only (no connecting lines)
      },
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 12, boxHeight: 6 } },
        tooltip: {
          mode: 'nearest',
          intersect: false,
          callbacks: {
            // Title shows compact numeric timestamp
            title: (items) => {
              const i = items[0].dataIndex;
              const d = parseLabelToDate(GD.labels[i]);
              return formatMDYHM(d);
            }
          }
        },
        decimation: { enabled: true, algorithm: 'lttb', samples: 250 }
      },
      scales: {
        x: {
          type: 'category',
          grid: {
            display: true,
            color: (ctx) => isMajorHour(null, ctx.scale, ctx.tick.value) ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.08)',
            lineWidth: (ctx) => isMajorHour(null, ctx.scale, ctx.tick.value) ? 1.2 : 0.5
          },
          ticks: {
            autoSkip: false,
            maxRotation: 0,
            minRotation: 0,
            callback: function(value, index, ticks) {
              if (index % showEvery !== 0) return '';
              const raw = this.getLabelForValue ? this.getLabelForValue(value) : (ticks[index]?.label ?? GD.labels[index]);
              const d = parseLabelToDate(raw);
              return formatMDYHM(d);
            }
          }
        },
        y: {
          grid: { display: true, color: 'rgba(0,0,0,0.08)' },
          border: { color: 'rgba(0,0,0,0.2)' }
        }
      },
      animation: false
    };

    function dotSeries(label, key, group, color) {
      return {
        label,
        data: group[key],
        borderColor: color,
        backgroundColor: color,
        showLine: false,         // ensure dots-only
        pointRadius: 2,
        pointHitRadius: 8
      };
    }

    // Height (with Combined)
    (() => {
      const ds = [
        dotSeries('Swell 1','s1',GD.height,colors.s1),
        dotSeries('Swell 2','s2',GD.height,colors.s2),
        dotSeries('Swell 3','s3',GD.height,colors.s3),
        dotSeries('Swell 4','s4',GD.height,colors.s4),
        dotSeries('Swell 5','s5',GD.height,colors.s5),
        dotSeries('Swell 6','s6',GD.height,colors.s6),
        {
          label:'Combined', data: GD.height.combined,
          borderColor: colors.combined, backgroundColor: colors.combined,
          showLine:false, pointRadius:2, pointHitRadius:8
        }
      ];
      new Chart(document.getElementById('heightChart').getContext('2d'), {
        type: 'line',
        data: { labels: GD.labels, datasets: ds },
        options: {
          ...commonOpts,
          plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Height' } },
          scales: {
            x: commonOpts.scales.x,
            y: { ...commonOpts.scales.y, beginAtZero:true, min:0, max:hMax, ticks:{ stepSize: heightStep(hMax) }, title:{ display:true, text:`Height (${GD.units})` } }
          }
        }
      });
    })();

    // Period
    (() => {
      const ds = [
        dotSeries('Swell 1','s1',GD.period,colors.s1),
        dotSeries('Swell 2','s2',GD.period,colors.s2),
        dotSeries('Swell 3','s3',GD.period,colors.s3),
        dotSeries('Swell 4','s4',GD.period,colors.s4),
        dotSeries('Swell 5','s5',GD.period,colors.s5),
        dotSeries('Swell 6','s6',GD.period,colors.s6)
      ];
      new Chart(document.getElementById('periodChart').getContext('2d'), {
        type: 'line',
        data: { labels: GD.labels, datasets: ds },
        options: {
          ...commonOpts,
          plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Period' } },
          scales: {
            x: commonOpts.scales.x,
            y: { ...commonOpts.scales.y, beginAtZero:true, min:0, max:pMax, ticks:{ stepSize: periodStep(pMax) }, title:{ display:true, text:'Period (s)' } }
          }
        }
      });
    })();

    // Direction
    (() => {
      const ds = [
        dotSeries('Swell 1','s1',GD.direction,colors.s1),
        dotSeries('Swell 2','s2',GD.direction,colors.s2),
        dotSeries('Swell 3','s3',GD.direction,colors.s3),
        dotSeries('Swell 4','s4',GD.direction,colors.s4),
        dotSeries('Swell 5','s5',GD.direction,colors.s5),
        dotSeries('Swell 6','s6',GD.direction,colors.s6)
      ];
      new Chart(document.getElementById('directionChart').getContext('2d'), {
        type: 'line',
        data: { labels: GD.labels, datasets: ds },
        options: {
          ...commonOpts,
          plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Direction' } },
          scales: {
            x: commonOpts.scales.x,
            y: { ...commonOpts.scales.y, min:dMin, max:dMax, ticks:{ stepSize:45 }, title:{ display:true, text:'Direction (°)' } }
          }
        }
      });
    })();
    {% endif %}
  </script>
</body>
</html>
