<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wave Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <style>
    html, body { height: 100%; }
    #map { height: 420px; border: 1px solid #ccc; }
    .leaflet-tooltip { font-weight: 600; }
    .sticky-top-bar { position: sticky; top: 0; z-index: 1000; background:#fff; border-bottom: 1px solid #eee; }
    canvas.chart-tall { height: 260px !important; }
    .card-title small { display:block; color:#6c757d; font-weight:400; }
  </style>
</head>
<body class="bg-light">

  <div class="container-fluid py-3">
    <div class="sticky-top-bar pb-2">
      <form id="controlForm" class="row g-2 align-items-center" method="GET" action="/">
        <div class="col-auto">
          <label for="station" class="form-label mb-0">Station</label>
          <select class="form-select" id="station" name="station">
            {% for sid, name in stations %}
              <option value="{{ sid }}" {% if sid == selected_station %}selected{% endif %}>{{ sid }} — {{ name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="tz" class="form-label mb-0">Time Zone</label>
          <select class="form-select" id="tz" name="tz">
            <option value="">(Buoy Local)</option>
            {% for tz in timezones %}
              <option value="{{ tz }}" {% if tz == selected_tz %}selected{% endif %}>{{ tz }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="unit" class="form-label mb-0">Units</label>
          <select class="form-select" id="unit" name="unit">
            {% for u in units %}
              <option value="{{ u }}" {% if u == selected_unit %}selected{% endif %}>{{ u }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="view" class="form-label mb-0">View</label>
          <select class="form-select" id="view" name="view">
            <option value="Table" {% if selected_view == 'Table' %}selected{% endif %}>Table</option>
            <option value="Graph" {% if selected_view == 'Graph' %}selected{% endif %}>Graph</option>
          </select>
        </div>

        <div class="col-auto">
          <button type="submit" class="btn btn-primary" id="updateBtn">Update</button>
        </div>
      </form>
    </div>

    <div class="row mt-2">
      <div class="col-12">
        <div id="map"></div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        {% if error %}
          <div class="alert alert-warning">{{ error }}</div>
        {% endif %}

        {% if selected_view == 'Graph' %}
          <!-- Graph View -->
          <div id="graphs" class="card">
            <div class="card-body">
              <h5 class="card-title mb-3">
                {% if graph_header %}
                  {{ graph_header.cycle }}
                  <small>{{ graph_header.location }} — Time Zone: {{ graph_header.tz }}</small>
                {% else %}
                  Graphs ({{ graph_data.units }})
                {% endif %}
              </h5>

              <div class="mb-4">
                <canvas id="heightChart" class="chart-tall"></canvas>
              </div>
              <div class="mb-4">
                <canvas id="periodChart" class="chart-tall"></canvas>
              </div>
              <div>
                <canvas id="directionChart" class="chart-tall"></canvas>
              </div>
            </div>
          </div>
        {% else %}
          <!-- Table View -->
          <div id="tableWrap" class="card">
            <div class="card-body">
              {{ table_html|safe }}
            </div>
          </div>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Keep/restore map view between requests
    // -------------------------------------------------------------
    const mapKey = 'mapView';
    function saveMapView(map) {
      const v = {c: map.getCenter(), z: map.getZoom()};
      sessionStorage.setItem(mapKey, JSON.stringify({lat: v.c.lat, lng: v.c.lng, z: v.z}));
    }
    function loadMapView() {
      try { return JSON.parse(sessionStorage.getItem(mapKey)); } catch(e) { return null; }
    }

    // Track if the user manually changed TZ; if not, selecting a station resets TZ to local.
    let tzManuallyChanged = false;
    document.getElementById('tz').addEventListener('change', () => { tzManuallyChanged = true; });
    document.getElementById('station').addEventListener('change', () => {
      if (!tzManuallyChanged) document.getElementById('tz').value = ''; // use buoy local by default
    });

    // -------------------------------------------------------------
    // Leaflet Map (Satellite, single world, no grey sides)
    // -------------------------------------------------------------
    const WORLD_BOUNDS = L.latLngBounds([-85, -180], [85, 180]);

    const map = L.map('map', {
      worldCopyJump: false,
      zoomControl: true,
      maxBounds: WORLD_BOUNDS,
      maxBoundsViscosity: 1.0,
      inertia: false
    });

    const saved = loadMapView();
    if (saved) {
      map.setView([saved.lat, saved.lng], saved.z);
    } else {
      map.setView([20, 0], 2);
    }

    // Esri World Imagery (satellite)
    const imagery = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles © Esri & contributors',
        maxZoom: 18,
        minZoom: 0,
        noWrap: true   // single, non-wrapping world
      }
    ).addTo(map);

    // Compute the minimum zoom so one world fills the viewport horizontally (no grey sidebars)
    function fitOneWorldNoGaps() {
      const widthPx = map.getSize().x;
      // world pixel width at zoom z is 256 * 2^z  ->  choose z so worldWidth >= viewport
      const neededZ = Math.ceil(Math.log2(widthPx / 256));
      const z = Math.max(imagery.options.minZoom || 0,
                Math.min(imagery.options.maxZoom || 18, neededZ));
      map.setMinZoom(z);
      if (map.getZoom() < z) map.setZoom(z);
      // Keep view inside the single-world bounds
      const center = map.getCenter();
      const clampedLat = Math.max(Math.min(center.lat, WORLD_BOUNDS.getNorth()), WORLD_BOUNDS.getSouth());
      const clampedLng = Math.max(Math.min(center.lng, WORLD_BOUNDS.getEast()), WORLD_BOUNDS.getWest());
      map.setView([clampedLat, clampedLng], z, {animate:false});
    }

    map.whenReady(() => {
      map.invalidateSize();
      fitOneWorldNoGaps();
    });
    window.addEventListener('resize', () => {
      map.invalidateSize();
      fitOneWorldNoGaps();
    });

    // Plot stations
    fetch('/stations.json')
      .then(r => r.json())
      .then(stations => {
        stations.forEach(s => {
          const mk = L.circleMarker([s.lat, s.lon], {
            radius: 2,
            color: '#FFD600',
            fillColor: '#FFD600',
            fillOpacity: 1,
            weight: 1
          }).addTo(map);
          mk.bindTooltip(s.id, {permanent: false, direction: 'top', offset: [0, -2]});
          // Click -> select station, auto-switch to station's local TZ (unless user set one)
          mk.on('click', () => {
            document.getElementById('station').value = s.id;
            if (!tzManuallyChanged) document.getElementById('tz').value = ''; // default to buoy local
            saveMapView(map);
            document.getElementById('controlForm').submit();
          });
        });
      });

    document.getElementById('controlForm').addEventListener('submit', () => saveMapView(map));

    // -------------------------------------------------------------
    // Graphs (only dots; no connecting lines)
    // -------------------------------------------------------------
    {% if selected_view == 'Graph' and graph_data %}
    const GD = {{ graph_data|tojson|safe }};

    const colors = {
      s1: '#C00000',
      s2: '#ED7D31',
      s3: '#FFC000',
      s4: '#00B050',
      s5: '#00B0F0',
      s6: '#92D050',
      combined: '#7030A0'
    };

    const finiteVals = arr => arr.filter(v => Number.isFinite(v));
    const maxAcross = arrays => arrays.reduce((m,a)=>Math.max(m, ...finiteVals(a)), -Infinity);
    const minAcross = arrays => arrays.reduce((m,a)=>Math.min(m, ...finiteVals(a)), +Infinity);
    const niceCeil = (v, step) => Math.ceil(v/step)*step;

    // axis ranges
    const heightArrays = [GD.height.s1, GD.height.s2, GD.height.s3, GD.height.s4, GD.height.s5, GD.height.s6, GD.height.combined];
    let hMax = maxAcross(heightArrays); if (!Number.isFinite(hMax)) hMax = 1;
    hMax = niceCeil(hMax * 1.10, hMax <= 2 ? 0.2 : hMax <= 4 ? 0.5 : 1);

    const periodArrays = [GD.period.s1, GD.period.s2, GD.period.s3, GD.period.s4, GD.period.s5, GD.period.s6];
    let pMax = maxAcross(periodArrays); if (!Number.isFinite(pMax)) pMax = 10;
    pMax = niceCeil(pMax * 1.10, pMax <= 8 ? 1 : pMax <= 16 ? 2 : 5);

    const dirArrays = [GD.direction.s1, GD.direction.s2, GD.direction.s3, GD.direction.s4, GD.direction.s5, GD.direction.s6];
    let dMin = minAcross(dirArrays), dMax = maxAcross(dirArrays);
    if (!Number.isFinite(dMin) || !Number.isFinite(dMax) || dMin === dMax) { dMin = 0; dMax = 360; }

    const baseOpts = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: true, axis: 'x' },
      layout: { padding: { top: 8, right: 8, bottom: 0, left: 8 } },
      elements: { point: { radius: 2 }, line: { tension: 0, borderWidth: 0 } }, /* no lines */
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 10, boxHeight: 6 } },
        tooltip: { mode: 'nearest', intersect: true },
        decimation: { enabled: false }
      },
      scales: {
        x: {
          type: 'category',
          grid: { color: 'rgba(0,0,0,0.08)' },
          ticks: { autoSkip: true, maxRotation: 0, minRotation: 0 }
        },
        y: { grid: { color: 'rgba(0,0,0,0.08)' } }
      },
      animation: false
    };

    function ds(label, arr, color) {
      return { label, data: arr, borderColor: color, backgroundColor: color, showLine: false, spanGaps: false };
    }

    // Height (includes Combined)
    new Chart(document.getElementById('heightChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: GD.labels,
        datasets: [
          ds('Swell 1', GD.height.s1, colors.s1),
          ds('Swell 2', GD.height.s2, colors.s2),
          ds('Swell 3', GD.height.s3, colors.s3),
          ds('Swell 4', GD.height.s4, colors.s4),
          ds('Swell 5', GD.height.s5, colors.s5),
          ds('Swell 6', GD.height.s6, colors.s6),
          ds('Combined', GD.height.combined, colors.combined)
        ]
      },
      options: {
        ...baseOpts,
        plugins: { ...baseOpts.plugins, title: { display: true, text: 'Swell Height' } },
        scales: {
          x: baseOpts.scales.x,
          y: { ...baseOpts.scales.y, beginAtZero: true, min: 0, max: hMax, title: { display:true, text:`Height (${GD.units})` } }
        }
      }
    });

    // Period
    new Chart(document.getElementById('periodChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: GD.labels,
        datasets: [
          ds('Swell 1', GD.period.s1, colors.s1),
          ds('Swell 2', GD.period.s2, colors.s2),
          ds('Swell 3', GD.period.s3, colors.s3),
          ds('Swell 4', GD.period.s4, colors.s4),
          ds('Swell 5', GD.period.s5, colors.s5),
          ds('Swell 6', GD.period.s6, colors.s6)
        ]
      },
      options: {
        ...baseOpts,
        plugins: { ...baseOpts.plugins, title: { display: true, text: 'Swell Period' } },
        scales: {
          x: baseOpts.scales.x,
          y: { ...baseOpts.scales.y, beginAtZero: true, min: 0, max: pMax, title: { display:true, text:'Period (s)' } }
        }
      }
    });

    // Direction
    new Chart(document.getElementById('directionChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: GD.labels,
        datasets: [
          ds('Swell 1', GD.direction.s1, colors.s1),
          ds('Swell 2', GD.direction.s2, colors.s2),
          ds('Swell 3', GD.direction.s3, colors.s3),
          ds('Swell 4', GD.direction.s4, colors.s4),
          ds('Swell 5', GD.direction.s5, colors.s5),
          ds('Swell 6', GD.direction.s6, colors.s6)
        ]
      },
      options: {
        ...baseOpts,
        plugins: { ...baseOpts.plugins, title: { display: true, text: 'Swell Direction' } },
        scales: {
          x: baseOpts.scales.x,
          y: { ...baseOpts.scales.y, min: dMin, max: dMax, title: { display:true, text:'Direction (°)' } }
        }
      }
    });
    {% endif %}
  </script>
</body>
</html>
