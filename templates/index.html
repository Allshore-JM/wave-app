<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wave Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js + time adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

  <style>
    html, body { height: 100%; }
    #map { height: 420px; border: 1px solid #ccc; }
    .leaflet-tooltip { font-weight: 600; }
    .sticky-top-bar { position: sticky; top: 0; z-index: 1000; background:#fff; border-bottom: 1px solid #eee; }
    canvas.chart-tall { height: 260px !important; }
  </style>
</head>
<body class="bg-light">
  <div class="container-fluid py-3">

    <!-- Top controls -->
    <div class="sticky-top-bar pb-2">
      <form id="controlForm" class="row g-2 align-items-center" method="GET" action="/">
        <div class="col-auto">
          <label for="station" class="form-label mb-0">Station</label>
          <select class="form-select" id="station" name="station">
            {% for sid, name in stations %}
              <option value="{{ sid }}" {% if sid == selected_station %}selected{% endif %}>{{ sid }} — {{ name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="tz" class="form-label mb-0">Time Zone</label>
          <select class="form-select" id="tz" name="tz">
            <option value="">(Buoy Local)</option>
            {% for tz in timezones %}
              <option value="{{ tz }}" {% if tz == selected_tz %}selected{% endif %}>{{ tz }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="unit" class="form-label mb-0">Units</label>
          <select class="form-select" id="unit" name="unit">
            {% for u in units %}
              <option value="{{ u }}" {% if u == selected_unit %}selected{% endif %}>{{ u }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="view" class="form-label mb-0">View</label>
          <select class="form-select" id="view" name="view">
            <option value="Table" {% if selected_view == 'Table' %}selected{% endif %}>Table</option>
            <option value="Graph" {% if selected_view == 'Graph' %}selected{% endif %}>Graph</option>
          </select>
        </div>

        <div class="col-auto">
          <button type="submit" class="btn btn-primary" id="updateBtn">Update</button>
        </div>
      </form>
    </div>

    <!-- Map -->
    <div class="row mt-2">
      <div class="col-12">
        <div id="map"></div>
      </div>
    </div>

    <!-- Table or Graphs -->
    <div class="row mt-3">
      <div class="col-12">
        {% if error %}
          <div class="alert alert-warning">{{ error }}</div>
        {% endif %}

        {% if selected_view == 'Graph' %}
          <div id="graphs" class="card">
            <div class="card-body">
              <!-- Graph header (Cycle • Location • Time Zone) -->
              <div class="mb-2">
                <div><strong>{{ graph_header.cycle }}</strong></div>
                <div><strong>{{ graph_header.location }}</strong></div>
                <div><strong>Time Zone: {{ graph_header.tz }}</strong></div>
              </div>

              <div class="mb-4">
                <canvas id="heightChart" class="chart-tall"></canvas>
              </div>
              <div class="mb-4">
                <canvas id="periodChart" class="chart-tall"></canvas>
              </div>
              <div>
                <canvas id="directionChart" class="chart-tall"></canvas>
              </div>
            </div>
          </div>
        {% else %}
          <div id="tableWrap" class="card">
            <div class="card-body">
              {{ table_html|safe }}
            </div>
          </div>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    // ------- Preserve map zoom/center across requests -------
    const mapKey = 'mapView';
    function saveMapView(map) {
      const v = {c: map.getCenter(), z: map.getZoom()};
      sessionStorage.setItem(mapKey, JSON.stringify({lat: v.c.lat, lng: v.c.lng, z: v.z}));
    }
    function loadMapView() {
      try { return JSON.parse(sessionStorage.getItem(mapKey)); } catch(e) { return null; }
    }

    // ------- Leaflet Map: single-world satellite, no grey sides -------
    const map = L.map('map', {
      worldCopyJump: false,
      zoomControl: true,
      minZoom: 2,
      maxZoom: 8,
      maxBounds: [[-85, -180],[85, 180]],
      maxBoundsViscosity: 1.0
    });
    const saved = loadMapView();
    if (saved) {
      map.setView([saved.lat, saved.lng], saved.z);
    } else {
      map.fitWorld({ animate: false });
      map.setZoom(2);
    }

    // Esri World Imagery (satellite)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      noWrap: true,
      attribution: '&copy; Esri'
    }).addTo(map);

    // Plot stations
    fetch('/stations.json')
      .then(r => r.json())
      .then(stations => {
        stations.forEach(s => {
          const mk = L.circleMarker([s.lat, s.lon], {
            radius: 2,
            color: '#FFD600',
            fillColor: '#FFD600',
            fillOpacity: 1,
            weight: 1
          }).addTo(map);
          mk.bindTooltip(s.id, {permanent: false, direction: 'top', offset: [0, -2]});
          mk.on('click', () => {
            document.getElementById('station').value = s.id;
            saveMapView(map);
            document.getElementById('controlForm').submit();
          });
        });
      });
    document.getElementById('controlForm').addEventListener('submit', () => saveMapView(map));

    {% if selected_view == 'Graph' and graph_data %}
    const GD = {{ graph_data|tojson|safe }};

    const colors = {
      s1: '#C00000', s2: '#ED7D31', s3: '#FFC000',
      s4: '#00B050', s5: '#00B0F0', s6: '#92D050',
      combined: '#7030A0'
    };

    // utility to convert parallel arrays -> array of {x, y}
    const pts = (x, arr) => x.map((t, i) => (arr[i] == null ? null : { x: t, y: arr[i] })).filter(p => p !== null);

    const commonOpts = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false, axis: 'x' },
      layout: { padding: { top: 8, right: 8, bottom: 0, left: 8 } },
      elements: { point: { radius: 1.6 }, line: { borderWidth: 0, tension: 0 } }, // **no connecting lines**
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 12, boxHeight: 6 } },
        tooltip: { mode: 'nearest', intersect: false }
      },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'MMM d, yyyy h:mm a' },
          ticks: {
            major: { enabled: true },
            source: 'auto',
            autoSkip: false,
            maxRotation: 0,
            // Major ticks at midnight; minor at 6‑hour steps
            callback: (value, index, ticks) => {
              const d = new Date(ticks[index].value);
              const h = d.getHours(), m = d.getMinutes();
              if (h === 0 && m === 0) return d.toLocaleDateString();
              if (m === 0 && (h % 6) === 0) return d.toLocaleTimeString([], {hour:'numeric'});
              return '';
            }
          },
          grid: { color: 'rgba(0,0,0,0.08)' }
        },
        y: {
          grid: { color: 'rgba(0,0,0,0.08)' },
          border: { color: 'rgba(0,0,0,0.2)' }
        }
      },
      animation: false
    };

    // HEIGHT (includes Combined)
    (() => {
      const ds = [
        { label:'Swell 1', data: pts(GD.x, GD.height.s1), borderColor: colors.s1, backgroundColor: colors.s1, showLine:false },
        { label:'Swell 2', data: pts(GD.x, GD.height.s2), borderColor: colors.s2, backgroundColor: colors.s2, showLine:false },
        { label:'Swell 3', data: pts(GD.x, GD.height.s3), borderColor: colors.s3, backgroundColor: colors.s3, showLine:false },
        { label:'Swell 4', data: pts(GD.x, GD.height.s4), borderColor: colors.s4, backgroundColor: colors.s4, showLine:false },
        { label:'Swell 5', data: pts(GD.x, GD.height.s5), borderColor: colors.s5, backgroundColor: colors.s5, showLine:false },
        { label:'Swell 6', data: pts(GD.x, GD.height.s6), borderColor: colors.s6, backgroundColor: colors.s6, showLine:false },
        { label:'Combined', data: pts(GD.x, GD.height.combined), borderColor: colors.combined, backgroundColor: colors.combined, showLine:false }
      ];
      new Chart(document.getElementById('heightChart'), {
        type: 'scatter',
        data: { datasets: ds },
        options: {
          ...commonOpts,
          plugins: { ...commonOpts.plugins, title: { display: true, text: `Swell Height (${GD.units})` } },
          scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, beginAtZero:true } }
        }
      });
    })();

    // PERIOD
    (() => {
      const ds = [
        { label:'Swell 1', data: pts(GD.x, GD.period.s1), borderColor: colors.s1, backgroundColor: colors.s1, showLine:false },
        { label:'Swell 2', data: pts(GD.x, GD.period.s2), borderColor: colors.s2, backgroundColor: colors.s2, showLine:false },
        { label:'Swell 3', data: pts(GD.x, GD.period.s3), borderColor: colors.s3, backgroundColor: colors.s3, showLine:false },
        { label:'Swell 4', data: pts(GD.x, GD.period.s4), borderColor: colors.s4, backgroundColor: colors.s4, showLine:false },
        { label:'Swell 5', data: pts(GD.x, GD.period.s5), borderColor: colors.s5, backgroundColor: colors.s5, showLine:false },
        { label:'Swell 6', data: pts(GD.x, GD.period.s6), borderColor: colors.s6, backgroundColor: colors.s6, showLine:false }
      ];
      new Chart(document.getElementById('periodChart'), {
        type: 'scatter',
        data: { datasets: ds },
        options: {
          ...commonOpts,
          plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Period (s)' } },
          scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, beginAtZero:true } }
        }
      });
    })();

    // DIRECTION
    (() => {
      const ds = [
        { label:'Swell 1', data: pts(GD.x, GD.direction.s1), borderColor: colors.s1, backgroundColor: colors.s1, showLine:false },
        { label:'Swell 2', data: pts(GD.x, GD.direction.s2), borderColor: colors.s2, backgroundColor: colors.s2, showLine:false },
        { label:'Swell 3', data: pts(GD.x, GD.direction.s3), borderColor: colors.s3, backgroundColor: colors.s3, showLine:false },
        { label:'Swell 4', data: pts(GD.x, GD.direction.s4), borderColor: colors.s4, backgroundColor: colors.s4, showLine:false },
        { label:'Swell 5', data: pts(GD.x, GD.direction.s5), borderColor: colors.s5, backgroundColor: colors.s5, showLine:false },
        { label:'Swell 6', data: pts(GD.x, GD.direction.s6), borderColor: colors.s6, backgroundColor: colors.s6, showLine:false }
      ];
      new Chart(document.getElementById('directionChart'), {
        type: 'scatter',
        data: { datasets: ds },
        options: {
          ...commonOpts,
          plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Direction (°)' } },
          scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, suggestedMin:0, suggestedMax:360 } }
        }
      });
    })();
    {% endif %}
  </script>
</body>
</html>
