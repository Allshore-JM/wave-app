<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wave Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    html, body { height: 100%; }
    #map { height: 420px; border: 1px solid #ccc; }
    .leaflet-tooltip { font-weight: 600; }
    .sticky-top-bar { position: sticky; top: 0; z-index: 1000; background:#fff; border-bottom: 1px solid #eee; }
    canvas.chart-tall { height: 260px !important; }
  </style>
</head>
<body class="bg-light">

<div class="container-fluid py-3">
  <div class="sticky-top-bar pb-2">
    <form id="controlForm" class="row g-2 align-items-center" method="GET" action="/">
      <div class="col-auto">
        <label for="station" class="form-label mb-0">Station</label>
        <select class="form-select" id="station" name="station">
          {% for sid, name in stations %}
            <option value="{{ sid }}" {% if sid == selected_station %}selected{% endif %}>{{ sid }} — {{ name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-auto">
        <label for="tz" class="form-label mb-0">Time Zone</label>
        <select class="form-select" id="tz" name="tz">
          <option value="">(Buoy Local)</option>
          {% for tz in timezones %}
            <option value="{{ tz }}" {% if tz == selected_tz %}selected{% endif %}>{{ tz }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-auto">
        <label for="unit" class="form-label mb-0">Units</label>
        <select class="form-select" id="unit" name="unit">
          <option value="US" {% if selected_unit == 'US' %}selected{% endif %}>US</option>
          <option value="SI" {% if selected_unit == 'SI' %}selected{% endif %}>SI</option>
        </select>
      </div>

      <div class="col-auto">
        <label for="view" class="form-label mb-0">View</label>
        <select class="form-select" id="view" name="view">
          <option value="Table" {% if selected_view == 'Table' %}selected{% endif %}>Table</option>
          <option value="Graph" {% if selected_view == 'Graph' %}selected{% endif %}>Graph</option>
        </select>
      </div>

      <div class="col-auto">
        <button type="submit" class="btn btn-primary" id="updateBtn">Update</button>
      </div>
    </form>
  </div>

  <div class="row mt-2">
    <div class="col-12">
      <div id="map"></div>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-12">
      {% if error %}
        <div class="alert alert-warning">{{ error }}</div>
      {% endif %}

      {% if selected_view == 'Graph' and graph_data %}
        <div class="card">
          <div class="card-body">
            <!-- Graph header line -->
            <div class="mb-2 small text-muted">
              <strong>Cycle :</strong> {{ graph_header.cycle or '' }}
              <span class="mx-2">|</span>
              <strong>Location :</strong> {{ graph_header.location or '' }}
              <span class="mx-2">|</span>
              <strong>Time Zone:</strong> {{ graph_header.timezone or selected_tz }}
            </div>

            <div class="mb-4">
              <canvas id="heightChart" class="chart-tall"></canvas>
            </div>
            <div class="mb-4">
              <canvas id="periodChart" class="chart-tall"></canvas>
            </div>
            <div>
              <canvas id="directionChart" class="chart-tall"></canvas>
            </div>
          </div>
        </div>
      {% else %}
        <div class="card"><div class="card-body">{{ table_html|safe }}</div></div>
      {% endif %}
    </div>
  </div>
</div>

<script>
  // Persist map view between requests
  const mapKey = 'mapView';
  const saveMapView = (map) => {
    const c = map.getCenter();
    sessionStorage.setItem(mapKey, JSON.stringify({lat: c.lat, lng: c.lng, z: map.getZoom()}));
  };
  const loadMapView = () => {
    try { return JSON.parse(sessionStorage.getItem(mapKey)); } catch(e){ return null; }
  };

  // Leaflet map (ESRI satellite; single world, no grey sides)
  const map = L.map('map', { worldCopyJump: false, zoomControl: true });
  const saved = loadMapView();
  if (saved) map.setView([saved.lat, saved.lng], saved.z);
  else map.setView([20, -160], 2);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 8, minZoom: 2, noWrap: true, attribution: '&copy; Esri'
  }).addTo(map);

  // Reset tz to "(Buoy Local)" when station changed via dropdown
  const tzSelect = document.getElementById('tz');
  const stationSelect = document.getElementById('station');
  stationSelect.addEventListener('change', () => {
    tzSelect.value = ""; // force server to derive the station's local tz
  });

  // Plot stations and set tz from the clicked station
  fetch('/stations.json')
    .then(r => r.json())
    .then(stations => {
      stations.forEach(s => {
        const marker = L.circleMarker([s.lat, s.lon], {
          radius: 2, color: '#FFD600', fillColor: '#FFD600', fillOpacity: 1, weight: 1
        }).addTo(map);
        marker.bindTooltip(s.id, {direction: 'top', offset: [0,-2]});
        marker.on('click', () => {
          // set station + station tz, keep zoom state
          stationSelect.value = s.id;
          tzSelect.value = s.tz || ""; // if tz is missing, server will still derive it
          saveMapView(map);
          document.getElementById('controlForm').submit();
        });
      });
    });

  document.getElementById('controlForm').addEventListener('submit', () => saveMapView(map));

  // ---------------- Charts (if Graph view) ----------------
  {% if selected_view == 'Graph' and graph_data %}
  const GD = {{ graph_data|tojson|safe }};
  const colors = {
    s1: '#C00000', s2: '#ED7D31', s3: '#FFC000',
    s4: '#00B050', s5: '#00B0F0', s6: '#92D050', combined:'#7030A0'
  };

  // Basic common options
  const commonOpts = {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false, axis: 'x' },
    elements: { point: { radius: 2 }, line: { tension: 0, borderWidth: 0 } }, /* dots only */
    plugins: { legend: { position: 'bottom' } },
    scales: {
      x: {
        type: 'category',
        grid: { color: 'rgba(0,0,0,.08)' },
        ticks: { autoSkip: false, maxRotation: 90, minRotation: 90 } /* 90° labels */
      },
      y: { grid: { color: 'rgba(0,0,0,.08)' } }
    }
  };

  function ds(label, arr, color) {
    return { label, data: arr, borderColor: color, backgroundColor: color, showLine: false, spanGaps: true };
  }

  // Height
  new Chart(document.getElementById('heightChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: GD.labels,
      datasets: [
        ds('Swell 1', GD.height.s1, colors.s1),
        ds('Swell 2', GD.height.s2, colors.s2),
        ds('Swell 3', GD.height.s3, colors.s3),
        ds('Swell 4', GD.height.s4, colors.s4),
        ds('Swell 5', GD.height.s5, colors.s5),
        ds('Swell 6', GD.height.s6, colors.s6),
        ds('Combined', GD.height.combined, colors.combined)
      ]
    },
    options: { ...commonOpts, plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Height' } },
      scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, title: {display: true, text: `Height (${GD.units})`} } }
    }
  });

  // Period
  new Chart(document.getElementById('periodChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: GD.labels,
      datasets: [
        ds('Swell 1', GD.period.s1, colors.s1),
        ds('Swell 2', GD.period.s2, colors.s2),
        ds('Swell 3', GD.period.s3, colors.s3),
        ds('Swell 4', GD.period.s4, colors.s4),
        ds('Swell 5', GD.period.s5, colors.s5),
        ds('Swell 6', GD.period.s6, colors.s6)
      ]
    },
    options: { ...commonOpts, plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Period' } },
      scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, title: {display: true, text: 'Period (s)'} } }
    }
  });

  // Direction
  new Chart(document.getElementById('directionChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: GD.labels,
      datasets: [
        ds('Swell 1', GD.direction.s1, colors.s1),
        ds('Swell 2', GD.direction.s2, colors.s2),
        ds('Swell 3', GD.direction.s3, colors.s3),
        ds('Swell 4', GD.direction.s4, colors.s4),
        ds('Swell 5', GD.direction.s5, colors.s5),
        ds('Swell 6', GD.direction.s6, colors.s6)
      ]
    },
    options: { ...commonOpts, plugins: { ...commonOpts.plugins, title: { display: true, text: 'Swell Direction' } },
      scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, title: {display: true, text: 'Direction (°)'} } }
    }
  });
  {% endif %}
</script>
</body>
</html>
