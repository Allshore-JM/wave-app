<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reef Assessment</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--ink:#12222f;--panel:#f6f9fc;--line:#d6e2ec;--warn:#b23b16}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
  #banner{background:#fff4e5;border-bottom:1px solid #ffcf8f;padding:7px 14px;font-size:13px;text-align:center}
  #banner b{color:var(--warn)}
  #wrap{display:flex;height:calc(100vh - 34px)}
  #map{flex:1;min-width:0}
  #side{width:340px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
  h1{font-size:18px;margin:0 0 2px}
  .sub{color:#5a6b7a;font-size:12px;margin-bottom:12px}
  .ctl{margin:10px 0}
  .ctl label{display:block;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#42576b;margin-bottom:3px}
  select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:14px}
  .info{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px}
  .info b{font-size:15px}
  .row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #e3edf5}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .tag.mod{background:#e3edf5;color:#345}.tag.low{background:#ffe6cc;color:#83440a}.tag.bad{background:#f8d7da;color:#842029}
  #live{margin-top:12px}#live .tag{margin:0 4px 4px 0}
  .danger{color:var(--warn);font-weight:600}
  .toggles{margin-top:12px;font-size:13px}
  .toggles label{display:block;margin:3px 0;font-weight:400;text-transform:none}
  canvas{margin-top:8px}
  a{color:#1668b8}
  .legend{font-size:11px;color:#5a6b7a;margin-top:6px}
  .legend i{width:22px;height:0;display:inline-block;vertical-align:middle;margin-right:4px}
  @media(max-width:720px){#wrap{flex-direction:column;height:auto}#side{width:100%;border-left:none;border-top:1px solid var(--line)}#map{height:52vh}}
</style>
</head>
<body>
<div id="banner">Modeled estimate with known uncertainty (~35&ndash;80&nbsp;m), prior-pinned &mdash; <b>NOT a safety device</b>. Absence of a warning never implies safety.</div>
<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <h1 id="title">Reef Assessment</h1>
    <div class="sub" id="subtitle"></div>

    <div class="ctl"><label>Swell height</label><select id="sel-hs"></select></div>
    <div class="ctl"><label>Period</label><select id="sel-tp"></select></div>
    <div class="ctl"><label>Direction</label><select id="sel-dir"></select></div>
    <div class="ctl"><label>Tide</label><select id="sel-tide"></select></div>

    <div class="info" id="live"></div>
    <div class="info" id="info"></div>
    <canvas id="chart" height="150"></canvas>
    <div class="toggles">
      <label><input type="checkbox" id="t-live" checked> Live conditions (buoy + tide)</label>
      <label><input type="checkbox" id="t-hill" checked> Shaded relief</label>
      <label><input type="checkbox" id="t-cont" checked> Depth contours</label>
      <label><input type="checkbox" id="t-impact" checked> Big-set impact line</label>
    </div>
    <div class="legend">
      <div><i style="border-top:3px solid #12b886"></i>takeoff zone &nbsp; <i style="border-top:3px dashed #12b886"></i>low-confidence</div>
      <div><i style="border-top:3px solid #b23b16"></i>impact line (danger is <b>shoreward</b> of it)</div>
    </div>
    <p class="sub" style="margin-top:12px"><a id="report-link" href="#" target="_blank">Full written assessment &rarr;</a></p>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script>
const DATA = location.pathname.replace(/\/+$/,'') + '/data/';
const Q = location.search;   // carry the access key (?k=...) onto every artifact request
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

Promise.all(['meta.json','zones.json','contours.geojson','profiles.json']
  .map(f => fetch(DATA+f+Q).then(r=>r.json())))
  .then(([meta,zones,contours,profiles]) => init(meta,zones,contours,profiles))
  .catch(e => { $('#info').textContent = 'Failed to load artifacts: '+e; });

function init(meta, zonesDoc, contours, profDoc){
  const zones = zonesDoc.zones;
  const axes = meta.axes_order;                 // [hs,tp,dir,tide]
  const opts = meta.selector_options;
  const fix = meta.reference_fix;
  $('#title').textContent = meta.name + ' Reef';
  $('#subtitle').innerHTML = `${Math.abs(fix.lat).toFixed(5)} ${fix.lat>=0?'N':'S'}, ${Math.abs(fix.lon).toFixed(5)} ${fix.lon>=0?'E':'W'} `
    + `&middot; DEM verified <b>${(meta.verification.verdict||'')}</b> `
    + `(${Math.round((meta.verification.coverage_frac||0)*100)}% lidar) &middot; artifact v${meta.artifact_version}`;
  $('#report-link').href = DATA+'report.html'+Q;

  // ---- map ----
  const map = L.map('map', {preferCanvas:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:20, attribution:'Esri World Imagery'}).addTo(map);
  let hill = null;
  if(meta.hillshade && meta.hillshade.bounds){
    hill = L.imageOverlay(DATA+meta.hillshade.png+Q, meta.hillshade.bounds, {opacity:0.35}).addTo(map);
  }
  const contLayer = L.geoJSON(contours, {style:f=>({color:'#2b6cb0',weight:f.properties.depth_m%10===0?1.4:0.5,opacity:0.6})}).addTo(map);
  if(meta.hillshade && meta.hillshade.bounds) map.fitBounds(meta.hillshade.bounds);
  else if(contLayer.getBounds().isValid()) map.fitBounds(contLayer.getBounds());
  else map.setView([fix.lat, fix.lon], 15);

  const fixDepth = meta.features && meta.features.crest && meta.features.crest.fix_at_reference_m;
  L.circleMarker([fix.lat,fix.lon],{radius:6,color:'#fff',weight:2,fillColor:'#111',fillOpacity:1})
    .addTo(map).bindTooltip('reference marker' + (fixDepth!=null ? ` (~${fixDepth} m)` : ''));
  const shoal = meta.features && meta.features.shallowest_point;
  if(shoal) L.circleMarker([shoal.lat,shoal.lon],{radius:5,color:'#b23b16',weight:2,fillColor:'#ffd7c2',fillOpacity:1})
    .addTo(map).bindTooltip(`shoal/inside hazard (~${shoal.depth_m} m)`);

  let dyn = L.layerGroup().addTo(map);
  let impactVisible = true;
  window.__reefmap = map;   // exposed for preview/debug only

  // ---- selectors ----
  function fill(sel, arr){ sel.innerHTML = arr.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join(''); }
  fill($('#sel-hs'), opts.hs_swell_ft);
  fill($('#sel-tp'), opts.tp_s);
  fill($('#sel-dir'), opts.dir_deg);
  fill($('#sel-tide'), opts.tide_m);
  // default: 12-16 ft, 17-20 s, NW, higher tide (a representative "works" bin)
  $('#sel-hs').value = Math.min(2, opts.hs_swell_ft.length-1);
  $('#sel-tp').value = opts.tp_s.length-1;
  $('#sel-dir').value = Math.min(1, opts.dir_deg.length-1);
  $('#sel-tide').value = opts.tide_m.length-1;

  const zmap = {};
  zones.forEach(z => zmap[z.bin.join(',')] = z);

  // ---- cross-section chart (fix line profile; fall back to nearest-to-zero transect) ----
  const fixProf = profDoc.profiles.find(p=>p.dv===0)
    || (profDoc.profiles||[]).slice().sort((a,b)=>Math.abs(a.dv)-Math.abs(b.dv))[0];
  const chart = fixProf ? new Chart($('#chart'), {
    type:'line',
    data:{labels:fixProf.s, datasets:[
      {label:'reef (fix line)', data:fixProf.depth, borderColor:'#345', borderWidth:1.6, pointRadius:0, tension:.2},
    ]},
    options:{responsive:true, animation:false, plugins:{legend:{display:false}},
      scales:{x:{title:{display:true,text:'seaward  ←  m from fix  →  shoreward'},ticks:{maxTicksLimit:6}},
              y:{reverse:true, title:{display:true,text:'depth (m)'}}}}
  }) : null;

  function drawChartBand(z){
    if(!fixProf || !chart) return;
    const d = z.depths_m;
    const band = {label:'band', data:fixProf.s.map(()=>d.zone_shoreward), borderColor:'rgba(18,184,134,.0)',
      backgroundColor:'rgba(18,184,134,.18)', fill:{value:d.zone_seaward}, pointRadius:0};
    const anchor = {label:'anchor', data:fixProf.s.map(()=>d.anchor), borderColor:'#0b8f5f', borderWidth:1.2, borderDash:[5,4], pointRadius:0};
    const impact = {label:'impact', data:fixProf.s.map(()=>d.impact_seaward), borderColor:'#b23b16', borderWidth:1.2, borderDash:[2,3], pointRadius:0};
    chart.data.datasets = [chart.data.datasets[0], band, anchor, impact];
    chart.update();
  }

  function style(z, low){
    return {color: low?'#0b8f5f':'#12b886', weight:2, dashArray: low?'6 5':null, fillColor:'#12b886', fillOpacity:0.18};
  }

  function update(){
    const idx = [ +$('#sel-hs').value, +$('#sel-tp').value, +$('#sel-dir').value, +$('#sel-tide').value ];
    const z = zmap[idx.join(',')];
    dyn.clearLayers();
    if(!z){ $('#info').innerHTML='No modeled zone for this bin.'; return; }
    const low = z.direction_confidence==='low';
    if(z.takeoff_zone){ L.geoJSON(z.takeoff_zone,{style:()=>style(z,low)}).addTo(dyn); }
    if(z.anchor){
      L.marker([z.anchor.lat,z.anchor.lon]).addTo(dyn)
        .bindTooltip('takeoff anchor',{permanent:false});
      L.circle([z.anchor.lat,z.anchor.lon],{radius:z.confidence_radius_m,color:'#12b886',weight:1,fill:false,dashArray:'3 4'}).addTo(dyn);
    }
    if(z.impact_zone_seaward_line && impactVisible){
      L.geoJSON(z.impact_zone_seaward_line,{style:()=>({color:'#b23b16',weight:2.5})}).addTo(dyn)
        .bindTooltip('big-set impact line — danger is SHOREWARD of this');
    }
    drawChartBand(z);
    const d = z.depths_m;
    $('#info').innerHTML =
      `<div class="row"><span>Source</span><span class="tag mod">${esc(z.source)}${z.prior_pinned?' (prior)':''}</span></div>`
      + `<div class="row"><span>Anchor depth</span><b>${d.anchor} m</b></div>`
      + `<div class="row"><span>Takeoff band</span><span>${d.zone_shoreward}&ndash;${d.zone_seaward} m</span></div>`
      + `<div class="row"><span>Anchor via</span><span>${esc(z.anchor_source||'—')}</span></div>`
      + `<div class="row"><span>Confidence radius</span><span>&plusmn;${z.confidence_radius_m} m</span></div>`
      + (z.direction_confidence==='low'?`<div class="row"><span>Direction</span><span class="tag low">low confidence</span></div>`:'')
      + (z.outer_reef_shadow?`<div class="row"><span class="danger">Shadowed</span><span class="tag low">outer reef breaks first &mdash; position unreliable</span></div>`:'')
      + (z.closeout?`<div class="row"><span>Wave quality</span><span class="tag low">closes out / sections on this direction</span></div>`:'')
      + (z.breaks_on_platform?`<div class="row"><span class="danger">Threshold swell</span><span>breaks on the crest &mdash; no band</span></div>`:'')
      + `<div class="row"><span class="danger">Caught-inside</span><span>shoreward of the red line + ${meta.inside_margin_m ?? 50} m</span></div>`;
  }

  // inc.2: the live panel drives the map. Sets the four selectors to the live bin and redraws;
  // a null bin (non-ok live state) clears the zone rather than leaving a stale one on the map.
  window.__reefApplyLiveBin = function(bin){
    if(bin){
      ['#sel-hs','#sel-tp','#sel-dir','#sel-tide'].forEach((s,i)=>$(s).value = String(bin[i]));
      update();
    } else {
      dyn.clearLayers();
      $('#info').innerHTML = '<span class="sub">No modeled zone for the live conditions — uncheck “Live” or use the selectors to explore.</span>';
    }
  };

  ['#sel-hs','#sel-tp','#sel-dir','#sel-tide'].forEach(s=>$(s).addEventListener('change',update));
  $('#t-hill').addEventListener('change',e=>{ if(hill){ e.target.checked?hill.addTo(map):hill.remove(); } });
  $('#t-cont').addEventListener('change',e=>{ e.target.checked?contLayer.addTo(map):contLayer.remove(); });
  $('#t-impact').addEventListener('change',e=>{ impactVisible=e.target.checked; update(); });
  update();
}

// ---- Live conditions panel (increment 2: DRIVES the map when Live is on). ------------------
// Nowcast SELECTOR, never a warning. Live on -> the buoy+tide pick the bin and draw its zone;
// non-ok states draw NO zone (honest). Any manual selector change drops to manual mode.
(function(){
  const LIVE = location.pathname.replace(/\/+$/,'') + '/live';
  let liveData = null, liveOn = true, lastKey = null;
  const fmtAge = s => (s==null) ? '—' : (s<3600 ? Math.round(s/60)+' min' : Math.floor(s/3600)+' h '+Math.round((s%3600)/60)+' m');
  const tag = (c,t) => `<span class="tag ${c}">${esc(t)}</span>`;
  const liveEl = () => $('#live');
  const toggle = () => $('#t-live');

  // effective age (local clock vs observed_utc, so it never freezes) + a local STALE flip
  function ageAndStale(d){
    let ageS = d.age_s, stale = d.state === 'stale';
    if(d.observed_utc){ const local = Math.round((Date.now()-Date.parse(d.observed_utc))/1000);
      if(Number.isFinite(local)){ ageS = Math.max(0, local); if(ageS > (d.staleness_max_s||5400)) stale = true; }
      else ageS = null; }
    return {ageS, stale};
  }

  function renderLive(){
    const el = liveEl(); if(!el) return;
    if(!liveOn){ el.innerHTML = '<b>Live conditions</b> '+tag('mod','off — manual selection')
        + '<div class="legend" style="margin-top:4px">Re-check “Live” to follow the buoy.</div>'; return; }
    const d = liveData;
    if(!d){ el.innerHTML = '<b>Live conditions</b><br>'+tag('mod','connecting to buoy…'); return; }
    const {ageS, stale} = ageAndStale(d);
    let chips = '';
    if(d.state==='disabled') chips = tag('mod','live disabled');
    else if(d.state==='no_data') chips = tag('bad','NO BUOY DATA — trust your eyes');
    else {
      if(stale) chips += tag('bad','STALE — '+fmtAge(ageS)+' old. No live zone.');
      else if(ageS>=3600) chips += tag('low','AGING — buoy '+fmtAge(ageS)+' ago');
      else if(d.conditions) chips += tag('mod','buoy '+fmtAge(ageS)+' ago');
      if(!stale && d.state==='ambiguous') chips += tag('low','two swells — mean direction not meaningful');
      if(d.state==='below_threshold') chips += tag('mod','below breaking threshold');
      if(d.state==='outside_window') chips += tag('low','direction outside the modeled arc');
      if(d.quality && d.quality.degraded) chips += tag('low','degraded reading');
      if(d.extrapolated) chips += tag('low','outside modeled range');
      if((d.near_bin_edge||[]).length) chips += tag('low','near a bin edge');
    }
    const c = d.conditions; let rows = '';
    if(c){ const r=(a,b)=>`<div class="row"><span>${a}</span><span>${esc(b)}</span></div>`;
      rows = r('Swell','≈'+c.hs_swell_ft+' ft') + r('Period', c.tp_s+' s')
           + r('Direction', c.dir_deg+'° ±'+c.dir_uncertainty_deg+'°')
           + r('Tide', c.tide_m+' m ±'+c.tide_uncertainty_m); }
    el.innerHTML = '<b>Live conditions</b><div style="margin:4px 0">'+chips+'</div>'+rows
      + '<div class="legend" style="margin-top:4px">Nowcast selector, not a warning — the reading is ~45 min old; waves in it already broke.</div>';
  }

  // render chips + drive the map, but only redraw when the effective bin CHANGES (no flicker).
  function tick(){
    renderLive();
    if(!liveOn || !window.__reefApplyLiveBin) return;
    const d = liveData; let bin = (d && d.state==='ok' && d.bin) ? d.bin : null;
    if(bin){ const {stale} = ageAndStale(d); if(stale) bin = null; }   // locally stale -> clear the zone
    const key = bin ? bin.join(',') : 'none';
    if(key !== lastKey){ lastKey = key; window.__reefApplyLiveBin(bin); }
  }

  async function pollLive(){
    if(!liveOn){ renderLive(); return; }
    try{ const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), 10000);
      liveData = await fetch(LIVE+Q, {cache:'no-store', signal:ac.signal}).then(r=>r.json());
      clearTimeout(to);
    }catch(e){ liveData = {state:'no_data'}; }
    tick();
  }

  // a manual selector change drops to manual mode (so the next poll won't yank the map back).
  ['#sel-hs','#sel-tp','#sel-dir','#sel-tide'].forEach(s=>{
    const el = $(s); if(el) el.addEventListener('change', ()=>{ liveOn=false; lastKey=null; if(toggle()) toggle().checked=false; renderLive(); });
  });
  if(toggle()) toggle().addEventListener('change', e=>{
    liveOn = e.target.checked; lastKey = null;
    if(liveOn) pollLive(); else renderLive();
  });

  renderLive(); pollLive();
  setInterval(pollLive, 300000);          // buoy cadence is 30 min; poll every 5
  setInterval(tick, 15000);               // tick the age locally + flip to STALE without a poll
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollLive(); });
})();
</script>
</body>
</html>
